name: plur1bus-distribution
x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
  stop_grace_period: 150s
services:
  harness:
    <<: *hardening
    image: ${PLUR1BUS_IMAGE:-plur1bus-harness:local}
    user: "10001:10001"
    labels: {app.plur1bus.stack: distribution}
    pids_limit: 1024
    mem_limit: 3g
    restart: unless-stopped
    volumes: [state:/state]
    networks: [internal, search-egress]
    # The current core serves authenticated Unix RPC. No unimplemented API is published.
    # Use compose.api.yaml only after the HTTP listener integration is installed.
  valkey:
    <<: *hardening
    profiles: [searxng]
    image: docker.io/valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    user: "999:999"
    labels: {app.plur1bus.stack: distribution}
    command: [valkey-server, --save, "", --appendonly, "no"]
    pids_limit: 64
    mem_limit: 128m
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m, /data:rw,nosuid,size=32m,uid=999,gid=999]
    networks:
      internal:
        aliases: [plur1bus-valkey]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  searxng:
    <<: *hardening
    profiles: [searxng]
    image: docker.io/searxng/searxng@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409
    user: "977:977"
    labels: {app.plur1bus.stack: distribution}
    pids_limit: 256
    mem_limit: 512m
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      GRANIAN_HOST: "0.0.0.0"
    entrypoint: [sh, -ec, 'test -n "$$SEARXNG_SECRET" || { echo "Set SEARXNG_SECRET" >&2; exit 64; }; exec /usr/local/searxng/entrypoint.sh']
    volumes: [./sidecars/searxng/settings.yml:/etc/searxng/settings.yml:ro]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m, /var/cache/searxng:rw,nosuid,size=64m,uid=977,gid=977]
    # Outgoing search requests need NAT. No sidecar port is published to the host.
    networks: [internal, search-egress]
    depends_on:
      valkey: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/searxng/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  internal:
    name: plur1bus-internal
    internal: true
    labels: {app.plur1bus.stack: distribution}
  search-egress:
    labels: {app.plur1bus.stack: distribution}
volumes:
  state:
    name: plur1bus-state
    labels: {app.plur1bus.stack: distribution}
