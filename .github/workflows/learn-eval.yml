name: Learning evaluation (manual only)
on:
  workflow_dispatch:
    inputs:
      models:
        description: Explicit model JSON list (provider, model, baseUrl with version, wireFormat)
        type: string
        required: true
      consent:
        description: Authorize paid model requests for these 24 synthetic cases
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  learn-eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.consent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: generate RPC schema types
        run: node packages/rpc-schema/src/build.mjs
      # Credentials reach the evaluation only through the harness secret store (docs/turn-eval.md). This is the one step that
      # sees the secrets; the next one resolves them from the store of the short-lived eval home. Only these two vendors'
      # keys are passed to this manually approved job, and the evaluation refuses every OpenAI profile (D110).
      - name: store the provider keys in the eval home's secret store
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ inputs.models }}
          PLUR1BUS_TURN_EVAL_HOME: ${{ runner.temp }}/learn-eval-home
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/turn-eval-secrets.ts
      - name: manually approved learning evaluation
        env:
          PLUR1BUS_LEARN_EVAL_LIVE: "1"
          PLUR1BUS_LEARN_EVAL_MODELS: ${{ inputs.models }}
          PLUR1BUS_TURN_EVAL_HOME: ${{ runner.temp }}/learn-eval-home
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/learn-eval.ts --live --out artifacts/learn-eval/report.json
      - name: remove the eval home
        if: always()
        run: rm -rf "${{ runner.temp }}/learn-eval-home"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: learn-eval-live, path: artifacts/learn-eval/report.json }

