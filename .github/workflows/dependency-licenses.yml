name: dependency-licenses
on:
  # Every pull request, without a paths filter: `dependency-licenses-gate` is a required check and must report on each
  # one. The platform legs run only when the pull request touches an input of the report (scripts/ci/license-changes.mjs).
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-licenses-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.plan.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/license-changes.mjs
  dependency-licenses:
    # Required through the gate below since all three legs ran green (owner decision 2026-10-28,
    # docs/dependency-policy.md).
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        # pnpm installs different native packages on each platform.
        os: [ubuntu-24.04, macos-15, windows-2025]
        # A main push repeats what its pull request already checked on every platform.
        exclude: ${{ fromJSON(github.event_name == 'push' && '[{"os":"macos-15"},{"os":"windows-2025"}]' || '[]') }}
    # The macOS leg runs on the owner's macOS VM runner while MACOS_SELF_HOSTED is true, but only for code from this
    # repository: a fork's pull request and a merge group keep macos-15 (docs/ci.md, "Self-hosted macOS runner").
    runs-on: ${{ (matrix.os == 'macos-15' && vars.MACOS_SELF_HOSTED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","plur1bus-macos-vm"]') || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: install pinned Rust metadata toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: install pinned workspace dependencies
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "$GH_ENGINE_READ_TOKEN" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "$GH_ENGINE_READ_TOKEN" ] && echo 'https://github.com/') 'git@github.com:' 'ssh://git@github.com/'; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: collect licence report without suppressing incomplete ecosystems
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-licenses"
          set +e
          node scripts/audit-deps.mjs --json > "$RUNNER_TEMP/dependency-licenses/licenses.json" 2> "$RUNNER_TEMP/dependency-licenses/errors.txt"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/dependency-licenses/exit-code.txt"
          printf 'Licence audit exit code: %s (inspect the dependency-licenses artifact).\n' "$code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: upload licence findings including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-licenses-${{ matrix.os }}
          path: ${{ runner.temp }}/dependency-licenses
          if-no-files-found: error
          retention-days: 14
  # THE check of this workflow (docs/dependency-policy.md, CLAUDE.md). It fails unless the selection ran and either every
  # platform leg passed or none was selected, because the pull request touches no input of the report.
  dependency-licenses-gate:
    needs: [changes, dependency-licenses]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every selected leg passed
        shell: bash
        env:
          PLAN: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LEGS: ${{ needs.dependency-licenses.result }}
        run: |
          expected=skipped
          if [ "$RELEVANT" = true ]; then expected=success; fi
          if [ "$PLAN" != success ] || [ "$LEGS" != "$expected" ]; then
            echo "::error::selection $PLAN (relevant: ${RELEVANT:-none}), licence legs $LEGS, expected $expected"
            exit 1
          fi
          echo "selection $PLAN, licence legs $LEGS"
