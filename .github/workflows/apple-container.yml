name: Apple container scaffold
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-scaffold:
    # Optional owner runner only. Never a required PR job.
    runs-on: [self-hosted, macOS, ARM64, macos-26-container]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24.21.0 }
      - name: Probe availability and disclose scaffold or skip reason
        run: node apps/desktop/scripts/apple-e2e.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: apple-container-availability
          path: apple-e2e-*.json
          if-no-files-found: error
          retention-days: 7
