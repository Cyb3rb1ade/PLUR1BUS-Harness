name: Apple container scaffold
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-scaffold:
    # Optional owner runner only. Never a required PR job.
    runs-on: [self-hosted, macOS, ARM64, macos-26-container]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0 }
      - name: Probe availability and disclose scaffold or skip reason
        run: node apps/desktop/scripts/apple-e2e.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apple-container-availability
          path: apple-e2e-*.json
          if-no-files-found: error
          retention-days: 7
