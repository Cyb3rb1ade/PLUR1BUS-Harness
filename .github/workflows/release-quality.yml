name: release-quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    # Committed attribution baseline is native macOS ARM; per-target payload notices differ.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: '1.95' }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: install pinned dependencies
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "$GH_ENGINE_READ_TOKEN" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "$GH_ENGINE_READ_TOKEN" ] && echo 'https://github.com/') 'git@github.com:' 'ssh://git@github.com/'; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: advisory gate (proposed owner threshold high)
        run: pnpm audit --audit-level high
      - run: node scripts/release/third-party.mjs --check
      - run: pnpm gen
      - run: pnpm build
      - name: strict types, theme independence and lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: node --test scripts/release/test/portable-backup.test.mjs scripts/release/test/source-quality.test.mjs
