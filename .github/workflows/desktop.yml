name: desktop
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml", "pnpm-lock.yaml", "pnpm-workspace.yaml", "scripts/lint-hygiene*"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml", "pnpm-lock.yaml", "pnpm-workspace.yaml", "scripts/lint-hygiene*"]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      upgrade_e2e:
        description: Run WP11 on locally built synthetic Docker and Podman images
        type: boolean
        default: false
      f2_acceptance:
        description: Run F2 Windows x64 repetitions instead of the normal matrix
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.f2_acceptance && '-f2' || '' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:macos' && '-noop' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # PR: the macOS dmg leg runs on label ci:macos or a platform-sensitive/apps/desktop change; push, schedule, dispatch: all legs.
  # Decides which macOS legs run (policy and path list: docs/ci.md, scripts/ci/macos-plan.mjs). One cheap ubuntu job.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.plan.outputs.proceed }}
      macos: ${{ steps.plan.outputs.macos }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --test scripts/ci/macos-plan.test.mjs && node scripts/ci/macos-plan.mjs --extra 'apps/desktop/**'
  desktop:
    needs: plan
    if: ${{ !inputs.f2_acceptance && needs.plan.outputs.proceed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
        cookie_guard: ["on", "off"]
        # cookie_guard "off" only on Windows. The macOS legs (the dmg) are dropped on a PR that neither carries the
        # ci:macos label nor touches a platform-sensitive path (needs.plan.outputs.macos, docs/ci.md).
        exclude: ${{ fromJSON(needs.plan.outputs.macos == 'true' && '[{"os":"macos-15","cookie_guard":"off"},{"os":"ubuntu-24.04","cookie_guard":"off"},{"os":"ubuntu-24.04-arm","cookie_guard":"off"}]' || '[{"os":"macos-15"},{"os":"ubuntu-24.04","cookie_guard":"off"},{"os":"ubuntu-24.04-arm","cookie_guard":"off"}]') }}
        include:
          - { os: macos-15, bundles: dmg, rust_target: aarch64-apple-darwin }
          - { os: windows-2025, bundles: nsis, rust_target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, bundles: nsis, rust_target: aarch64-pc-windows-msvc }
          - { os: ubuntu-24.04, bundles: "deb,rpm,appimage", rust_target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, bundles: "deb,rpm,appimage", rust_target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLUR1BUS_DESKTOP_ALLOW_PLACEHOLDER_KEY: "1"
      PLUR1BUS_DESKTOP_COOKIE_GUARD: ${{ matrix.cookie_guard }}
      PLUR1BUS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Process-scoped transport rewrite; no git config files are changed.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot; explicit toolchain below
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf xvfb openbox dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Isolate UI test browser storage
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/plur1bus-playwright" >> "$GITHUB_ENV"
      - name: Lifecycle report path (runner.temp is not available in job-level env)
        run: echo "PLUR1BUS_LIFECYCLE_REPORT=$RUNNER_TEMP/lifecycle-report.json" >> "$GITHUB_ENV"
      - name: Install UI test browser (Linux)
        if: runner.os == 'Linux'
        run: node apps/desktop/scripts/ui-browser.mjs install --with-deps
      - name: Install UI test browser (macOS and Windows)
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/ui-browser.mjs install
      - name: Verify pinned UI browser
        run: node apps/desktop/scripts/ui-browser.mjs verify
      - run: pnpm --filter @plur1bus/desktop-ui build
      - run: pnpm --filter @plur1bus/desktop-ui test
      - run: cargo fmt --all -- --check
        working-directory: apps/desktop
      - name: Windows target build check
        if: runner.os == 'Windows'
        run: cargo check --locked --workspace --tests --target "${{ matrix.rust_target }}"
        working-directory: apps/desktop
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: apps/desktop
      # Stable Rust 1.95 rejects --report-time; bounded proxy tests emit named elapsed_ms.
      # Isolate latency measurements from unrelated parallel tests; keep every test and limit.
      - run: cargo test --locked --workspace --no-fail-fast -- --test-threads=1 --nocapture
        id: desktop-rust-tests
        timeout-minutes: 15
        working-directory: apps/desktop
      - name: Windows libtest loader failure evidence
        if: runner.os == 'Windows' && failure() && steps.desktop-rust-tests.outcome == 'failure'
        timeout-minutes: 10
        run: node apps/desktop/scripts/windows-libtest-loader.mjs --output "$RUNNER_TEMP/plur1bus-libtest-loader"
      - name: Windows libtest loader evidence artifacts
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-libtest-loader-${{ matrix.os }}-${{ matrix.cookie_guard }}
          path: ${{ runner.temp }}/plur1bus-libtest-loader/
          if-no-files-found: warn
          retention-days: 7
      - name: Native fixture tests
        timeout-minutes: 10
        run: cargo test --locked -p plur1bus-desktop --example transport_spike --example production_spa --example production_driver --example production_job
        working-directory: apps/desktop
      - name: Native probe and Windows startup diagnostic tests
        id: native-diagnostics
        timeout-minutes: 5
        run: node --test apps/desktop/scripts/owned-process.test.mjs apps/desktop/scripts/fixture-job.test.mjs apps/desktop/scripts/lifecycle-report.test.mjs apps/desktop/scripts/windows-focus-summary.test.mjs apps/desktop/scripts/windows-startup.test.mjs apps/desktop/src-tauri/examples/transport-spike/probe.test.mjs
      - name: Native transport spike (WebKitGTK)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a node apps/desktop/scripts/transport-spike.mjs
      - name: Native transport spike (WKWebView and WebView2)
        if: runner.os != 'Linux' && (success() || (failure() && steps.native-diagnostics.outcome == 'failure'))
        timeout-minutes: 10
        run: node apps/desktop/scripts/transport-spike.mjs
      - name: Native deep-link startup and second-instance delivery (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # Own session bus like the lifecycle step: the singleton forwards over D-Bus, never via the runner's user bus.
        run: xvfb-run -a dbus-run-session -- node apps/desktop/scripts/native-deeplink.mjs
      - name: Native deep-link startup and second-instance delivery (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: node apps/desktop/scripts/native-deeplink.mjs
      - name: Packaging script unit tests
        run: node --test apps/desktop/scripts/test/*.test.mjs
      - name: Native transport observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-native-transport-${{ matrix.os }}-${{ matrix.cookie_guard }}
          path: ${{ runner.temp }}/plur1bus-native-spike-run-*/native-*
          if-no-files-found: warn
          retention-days: 7
      - name: Native SPA login, restart and isolation (WebKitGTK)
        if: runner.os == 'Linux' && (success() || (failure() && steps.native-diagnostics.outcome == 'failure'))
        timeout-minutes: 15
        run: xvfb-run -a node apps/desktop/scripts/native-spa.mjs --output "$RUNNER_TEMP/plur1bus-native-spa-observations"
      - name: Native SPA login, restart and isolation (WKWebView and WebView2)
        if: runner.os != 'Linux' && (success() || (failure() && steps.native-diagnostics.outcome == 'failure'))
        timeout-minutes: 15
        run: node apps/desktop/scripts/native-spa.mjs --output "$RUNNER_TEMP/plur1bus-native-spa-observations"
      - name: Native lifecycle and isolated second instance (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          xvfb-run -a dbus-run-session -- sh -c '
            openbox >/dev/null 2>&1 &
            native_wm_pid=$!
            trap "kill $native_wm_pid 2>/dev/null || true" EXIT
            node apps/desktop/scripts/native-lifecycle.mjs
          '
      - name: Native lifecycle and isolated second instance (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: node apps/desktop/scripts/native-lifecycle.mjs
      - name: Retain Windows lifecycle coverage
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-lifecycle-${{ matrix.os }}-${{ matrix.cookie_guard }}
          path: ${{ runner.temp }}/lifecycle-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Native crash restart, Shell acknowledgment and diagnostics Quit (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          xvfb-run -a dbus-run-session -- sh -c '
            openbox >/dev/null 2>&1 &
            native_wm_pid=$!
            trap "kill $native_wm_pid 2>/dev/null || true" EXIT
            node apps/desktop/scripts/native-diagnostics.mjs
          '
      - name: Native crash restart, Shell acknowledgment and diagnostics Quit (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: node apps/desktop/scripts/native-diagnostics.mjs
      - name: Native AppKit tray headers, tooltip and template fallback (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: node apps/desktop/scripts/native-tray.mjs
      - name: Native SPA observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-native-spa-${{ matrix.os }}-${{ matrix.cookie_guard }}
          path: ${{ runner.temp }}/plur1bus-native-spa-observations/
          if-no-files-found: warn
          retention-days: 7
      - run: pnpm tauri build --debug --no-bundle -- --locked
        working-directory: apps/desktop
      - name: Unsigned online bundles
        run: pnpm tauri build --bundles "${{ matrix.bundles }}" -- --locked
        working-directory: apps/desktop
      - name: Prove fixture switches absent from release executable
        shell: bash
        run: |
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          node apps/desktop/scripts/check-release-seams.mjs "apps/desktop/target/debug/plur1bus-desktop${suffix}" "apps/desktop/target/release/plur1bus-desktop${suffix}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-unsigned-${{ matrix.os }}-${{ matrix.cookie_guard }}
          path: |
            apps/desktop/target/release/bundle/**/*.dmg
            apps/desktop/target/release/bundle/**/*.exe
            apps/desktop/target/release/bundle/**/*.deb
            apps/desktop/target/release/bundle/**/*.rpm
            apps/desktop/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 7
  windows-focus-summary:
    name: Windows strict focus coverage
    needs: desktop
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLUR1BUS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLUR1BUS_DESKTOP_MATRIX_RESULT: ${{ needs.desktop.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-lifecycle-windows-*
          path: ${{ runner.temp }}/windows-focus-reports
      - name: Require exact-head strict x64 coverage and disclose ARM skips
        if: always()
        run: node apps/desktop/scripts/windows-focus-summary.mjs "$RUNNER_TEMP/windows-focus-reports"
  stub-smoke:
    name: stub smoke (${{ matrix.runtime }})
    needs: plan
    if: ${{ !inputs.f2_acceptance && needs.plan.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      PLUR1BUS_DESKTOP_E2E_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install Podman for the isolated CI runtime
        if: matrix.runtime == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build test-only stub image
        run: node apps/desktop/stub-image/build.mjs --runtime "${{ matrix.runtime }}"
      - name: Verify stub lifecycle and container restrictions
        run: node apps/desktop/stub-image/smoke.mjs --runtime "${{ matrix.runtime }}"
  f2-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.f2_acceptance }}
    name: F2 ${{ matrix.suite }} (${{ matrix.cookie_guard }})
    runs-on: windows-2025
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: spa
            cookie_guard: "on"
            iterations: 20
          - suite: spa
            cookie_guard: "off"
            iterations: 20
          - suite: startup
            cookie_guard: "on"
            iterations: 30
    defaults:
      run:
        shell: bash
    env:
      PLUR1BUS_DESKTOP_ALLOW_PLACEHOLDER_KEY: "1"
      PLUR1BUS_DESKTOP_COOKIE_GUARD: ${{ matrix.cookie_guard }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          toolchain: "1.95"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plur1bus/desktop-ui build
      - name: Run independent repetitions (no retries)
        timeout-minutes: ${{ matrix.suite == 'spa' && 100 || 60 }}
        run: node apps/desktop/scripts/windows-flake-loop.mjs "${{ matrix.suite }}" "${{ matrix.iterations }}" "$RUNNER_TEMP/f2-${{ matrix.suite }}"
      - name: Preserve exact-head evidence
        if: always()
        run: |
          echo "Head: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite: ${{ matrix.suite }}, cookie guard: ${{ matrix.cookie_guard }}, requested iterations: ${{ matrix.iterations }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/f2-${{ matrix.suite }}/summary.json" ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/f2-${{ matrix.suite }}/summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: f2-${{ matrix.suite }}-${{ matrix.cookie_guard }}-${{ github.sha }}
          path: ${{ runner.temp }}/f2-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 7

  upgrade-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      PLUR1BUS_DESKTOP_E2E_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: "1.95" }
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install -y podman libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plur1bus/desktop-ui build
      - name: Upgrade and rollback with synthetic persisted device state
        run: node apps/desktop/scripts/upgrade-e2e.mjs "${{ matrix.runtime }}"

  canary:
    name: Advisory Tauri 3 and CEF compile
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: "1.95" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev
      - run: pnpm install --frozen-lockfile && pnpm --filter @plur1bus/desktop-ui build
      - name: Compile actual shell with experimental runtime (advisory)
        shell: bash
        run: |
          set -o pipefail
          git apply apps/desktop/canary/tauri3.patch
          cargo check --manifest-path apps/desktop/Cargo.toml --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/tauri3-canary.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tauri3-canary
          path: ${{ runner.temp }}/tauri3-canary.log
          retention-days: 7

  repro:
    name: Advisory unsigned Linux deb reproducibility
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      PLUR1BUS_DESKTOP_ALLOW_PLACEHOLDER_KEY: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: "1.95" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf
      - run: pnpm install --frozen-lockfile && pnpm --filter @plur1bus/desktop-ui build
      - name: Build twice and compare bundle hashes
        working-directory: apps/desktop
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          for iteration in 1 2; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/repro-$iteration" pnpm tauri build --bundles deb -- --locked
            find "$RUNNER_TEMP/repro-$iteration/release/bundle/deb" -name '*.deb' -exec sha256sum {} \; | awk '{print $1}' | sort > "$RUNNER_TEMP/repro-$iteration.sha256"
            test -s "$RUNNER_TEMP/repro-$iteration.sha256"
          done
          diff -u "$RUNNER_TEMP/repro-1.sha256" "$RUNNER_TEMP/repro-2.sha256" | tee "$RUNNER_TEMP/repro-diff.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-repro
          path: |
            ${{ runner.temp }}/repro-*.sha256
            ${{ runner.temp }}/repro-diff.txt
          retention-days: 7
