name: release-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    name: functional smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2025, target: win-x64 }
          - { os: windows-11-arm, target: win-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: '1.95' }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: install pinned dependencies
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "$GH_ENGINE_READ_TOKEN" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "$GH_ENGINE_READ_TOKEN" ] && echo 'https://github.com/') 'git@github.com:' 'ssh://git@github.com/'; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm build
      - run: cargo build --release -p plur1bus
      - name: fresh-home functional smoke with installed runtime
        shell: bash
        run: |
          exe=''; [ "$RUNNER_OS" != 'Windows' ] || exe='.exe'
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe"
          node --experimental-strip-types --test --test-timeout=360000 tests/e2e/smoke.test.ts
        env:
          PLUR1BUS_CI_RECALL_HARD_MS: '3000'
      - name: real embedding, reranker and restart (existing acceptance)
        shell: bash
        run: |
          exe=''; [ "$RUNNER_OS" != 'Windows' ] || exe='.exe'
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe"
          node --experimental-strip-types --test --test-timeout=300000 tests/system/two-session-recall.test.ts
        env:
          PLUR1BUS_REAL_MODELS: '1'
          PLUR1BUS_MODELS_CACHE: ${{ runner.temp }}/release-real-models
          PLUR1BUS_CI_RECALL_HARD_MS: '3000'
      - name: installed-runtime T6 smoke with real models
        shell: bash
        run: |
          exe=''; [ "$RUNNER_OS" != 'Windows' ] || exe='.exe'
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe"
          node --experimental-strip-types --test --test-timeout=600000 tests/e2e/smoke.test.ts
        env:
          PLUR1BUS_REAL_MODELS: '1'
          # The models the acceptance step above downloaded and verified (the engine checks every file's SHA-256 again
          # at each start). That step covers the download; without the cache this smoke fetched the ~1 GB again into its
          # home, on Windows on the slow C: drive, and the core that `setup` starts threw a second copy away.
          PLUR1BUS_MODELS_CACHE: ${{ runner.temp }}/release-real-models
          PLUR1BUS_CI_RECALL_HARD_MS: '3000'
      - run: node --experimental-strip-types --test tests/system/helpers.test.ts
      - name: encrypted full-state and vault round trip
        shell: bash
        run: |
          exe=''; [ "$RUNNER_OS" != 'Windows' ] || exe='.exe'
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe"
          node --experimental-strip-types --conditions=source --test --test-timeout=180000 tests/system/portable-backup.test.ts
        env:
          PLUR1BUS_CI_RECALL_HARD_MS: '3000'
      - name: installer launcher contract (no administrator operation)
        run: node --experimental-strip-types --test --test-timeout=120000 tests/system/install-scripts.test.ts
      - name: setup, service unit and archive contracts
        run: cargo test --release -p plur1bus --test setup --test setup_profile --test service --test install_archive -- --test-threads=1
      - name: require Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
          test -S "/run/user/$uid/bus"
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user list-units >/dev/null
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
      - name: native OS service registration and removal
        run: cargo test --release -p plur1bus --test service_real -- --test-threads=1
        env:
          PLUR1BUS_SERVICE_TEST: '1'
      - name: injected native update rollback
        run: cargo test --release -p plur1bus --test update_apply -- --test-threads=1
      # Remaining uninstall/reboot fixtures use POSIX processes/signals.
      - name: injected update rollback, uninstall and simulated reboot (POSIX fixtures)
        if: runner.os != 'Windows'
        run: cargo test --release -p plur1bus --test uninstall --test reboot -- --test-threads=1
      - name: evidence scope
        shell: bash
        run: |
          {
            echo '### Functional smoke scope'
            echo 'Target: ${{ matrix.target }}. Native installed runtime; fake chat and flat embedding seam.'
            echo 'Separate existing real-model acceptance also runs on this target; T6 still requires all native outcomes. OS service reboot remains manual.'
            echo 'Native injected-update rollback runs above; Windows standalone uninstall/reboot fixture port remains open; do not count empty cfg(unix) suites as passes.'
          } >> "$GITHUB_STEP_SUMMARY"
