name: container distribution
on:
  pull_request:
    paths: [containers/**, crates/**, packages/**, Cargo.lock, .github/workflows/containers.yml]
  push:
    branches: [main]
    tags: ['v*']
    paths: [containers/**, crates/**, packages/**, Cargo.lock, .github/workflows/containers.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/cyb3rb1ade/plur1bus-harness-distribution
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/harness/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/harness.tar,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          secrets: |
            engine_token=${{ secrets.GH_ENGINE_READ_TOKEN }}
      - name: Scan report (informational until release)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          input: /tmp/harness.tar
          format: json
          output: trivy.json
          exit-code: '0'
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-scan
          path: trivy.json
          if-no-files-found: warn
  push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package visibility before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api --include /users/Cyb3rb1ade/packages/container/plur1bus-harness-distribution 2>package-error.txt) || {
            if grep -q 'HTTP 404' package-error.txt; then exit 0; fi
            cat package-error.txt >&2
            exit 1
          }
          visibility=$(printf '%s\n' "$status" | sed '1,/^\r\{0,1\}$/d' | jq -r .visibility)
          if [ "${{ github.ref_type }}" = tag ]; then
            case "$visibility" in private|public) ;; *) exit 1 ;; esac
          else
            test "$visibility" = private
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      # New GHCR packages default to private. Visibility is changed manually at release.
      - id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/harness/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          outputs: type=image,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          secrets: |
            engine_token=${{ secrets.GH_ENGINE_READ_TOKEN }}
      - name: Container offer for the signed channel feed
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE@$DIGEST" '{containers: {image: $image, storeSchema: 1}}' > container-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-release-fragment
          path: container-release.json
          if-no-files-found: error
