name: container distribution
on:
  pull_request:
    paths: [containers/**, crates/**, packages/**, Cargo.lock, .github/workflows/containers.yml]
  push:
    branches: [main]
    tags: ['v*']
    paths: [containers/**, crates/**, packages/**, Cargo.lock, .github/workflows/containers.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/cyb3rb1ade/plur1bus-harness-distribution
jobs:
  # Owner decision 2026-10-18: pull requests build linux/amd64 only; pushes to main, v* tags and workflow_dispatch also
  # build linux/arm64. Every architecture builds natively on its own runner (ubuntu-24.04-arm for arm64, as in ci.yml),
  # never under QEMU emulation (slow, and it crashed with SIGSEGV once). The `container` workflow's
  # `build + smoke (amd64)` does not cover this job: it builds the root Dockerfile, this one containers/harness/Dockerfile.
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/harness/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=oci,dest=/tmp/harness.tar,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          secrets: |
            engine_token=${{ secrets.GH_ENGINE_READ_TOKEN }}
      - name: Scan report (informational until release)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          input: /tmp/harness.tar
          format: json
          output: trivy.json
          exit-code: '0'
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-scan-${{ matrix.arch }}
          path: trivy.json
          if-no-files-found: warn
  # Publication: each architecture is built natively and pushed by digest only (with its own SBOM and provenance), then
  # `publish` joins the per-architecture indexes into one multi-arch index under the sha-/ref tags. Attestation manifests
  # are carried over by `imagetools create`; the published digest is the joined index's.
  push:
    name: push (${{ matrix.arch }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package visibility before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api --include /users/Cyb3rb1ade/packages/container/plur1bus-harness-distribution 2>package-error.txt) || {
            if grep -q 'HTTP 404' package-error.txt; then exit 0; fi
            cat package-error.txt >&2
            exit 1
          }
          visibility=$(printf '%s\n' "$status" | sed '1,/^\r\{0,1\}$/d' | jq -r .visibility)
          if [ "${{ github.ref_type }}" = tag ]; then
            case "$visibility" in private|public) ;; *) exit 1 ;; esac
          else
            test "$visibility" = private
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      # New GHCR packages default to private. Visibility is changed manually at release.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/harness/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          secrets: |
            engine_token=${{ secrets.GH_ENGINE_READ_TOKEN }}
      - name: Record the per-architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: publish
        name: Multi-arch index (amd64 + arm64) under the sha- and ref tags
        run: |
          set -euo pipefail
          amd64=$(cat digests/amd64); arm64=$(cat digests/arm64)
          for d in "$amd64" "$arm64"; do printf '%s\n' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; done
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:sha-$GITHUB_SHA")
          for platform in linux/amd64 linux/arm64; do
            printf '%s' "$raw" | jq -e --arg p "$platform" '[.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"] | index($p) != null' >/dev/null \
              || { echo "::error::published index lacks $platform"; exit 1; }
          done
          printf '%s' "$raw" | jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 2' >/dev/null \
            || { echo "::error::published index lacks the per-architecture attestation manifests"; exit 1; }
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Container offer for the signed channel feed
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE@$DIGEST" '{containers: {image: $image, storeSchema: 1}}' > container-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-release-fragment
          path: container-release.json
          if-no-files-found: error
