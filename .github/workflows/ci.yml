name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:macos' && '-noop' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Conservative impact selection; main/nightly/manual runs keep the full matrix.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      ts-core: ${{ steps.plan.outputs.ts-core }}
      web: ${{ steps.plan.outputs.web }}
      python: ${{ steps.plan.outputs.python }}
      docs-only: ${{ steps.plan.outputs.docs-only }}
      workflows: ${{ steps.plan.outputs.workflows }}
      engine-pin: ${{ steps.plan.outputs.engine-pin }}
      documents: ${{ steps.plan.outputs.documents }}
      proceed: ${{ steps.plan.outputs.proceed }}
      macos: ${{ steps.plan.outputs.macos }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --test scripts/ci/*.test.mjs && node scripts/ci/changes.mjs
  # Gated: the ubuntu leg is the `unit (ubuntu-24.04)` check. The macOS and Windows legs are `unit-os` below, which has the
  # same steps (workflow-contract.test.mjs keeps them identical) but is not in `ci-gate`'s needs: slow, often red.
  unit:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # A hang fails fast: the job has a ceiling, and each long test step its own, below it.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 90 || 65 }}
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_TOKENIZER_FILES_REQUIRED: "1"
      # PLUR1BUS_TOKENIZER_DIR is set on the steps that use it: a job's env has no `runner` context, and GitHub rejects
      # the whole workflow file when one is referenced there.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      # The coding-gate verifier and the D106 sandbox run commands under bubblewrap on Linux and fail
      # closed without it (owner decision 2026-10-17). Ubuntu 24.04 also restricts unprivileged user
      # namespaces through AppArmor, which bwrap needs; lift that for the test run only.
      - name: install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true && echo "bwrap ok"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-toolchain.mjs
      - run: node --test scripts/check-toolchain.test.mjs
      - name: config fixture drift (before generation)
        run: node packages/config-schema/src/gen-defaults.mjs --check
      - run: pnpm gen
      - run: pnpm build
      # A cold full-program strict check needs >2 GiB (incremental only saves warm runs).
      # Preserve the same compiler inputs/options; give V8 headroom on the 7 GiB macOS runner.
      - run: node packages/config-schema/src/gen-defaults.mjs --check && pnpm lint
        env:
          NODE_OPTIONS: ${{ runner.os == 'macOS' && '--max-old-space-size=4096' || '' }}
      - name: reasoning metadata schema and coverage hints
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/check-reasoning-metadata.mjs
      - name: unit tests with file timings
        if: needs.changes.outputs.ts-core == 'true'
        shell: bash
        run: |
          export TEST_TIMING_DIR="$GITHUB_WORKSPACE/test-timings"
          reporter="$(node -e 'console.log(require("node:url").pathToFileURL(process.cwd() + "/scripts/release/timing-reporter.mjs").href)')"
          export NODE_OPTIONS="--test-reporter=$reporter --test-reporter-destination=stdout"
          # The Core files run exactly once in core-unit-shard; every other package stays here.
          node scripts/run-ts-tests.mjs --filter=!@plur1bus/core
        timeout-minutes: ${{ matrix.os == 'windows-2025' && 35 || 25 }}
        env:
          # macOS finds the system Chrome and would run packages/web's whole browser suite in-line (20+ min, so the step
          # timed out before core ran). Off here by this explicit switch, never by dropping the Chrome path; the suites
          # run in `web-browser-macos` below (docs/ci.md). Linux (no Chromium here) and Windows are unchanged.
          PLUR1BUS_WEB_BROWSER: ${{ runner.os == 'macOS' && 'off' || '' }}
      - name: slowest 20 test files
        if: always() && needs.changes.outputs.ts-core == 'true'
        run: node scripts/release/timing-summary.mjs test-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.ts-core == 'true'
        with:
          name: test-timings-${{ matrix.os }}
          path: test-timings/
          if-no-files-found: error
      # The vacuous-run guard must trip on every OS (a filter that matches nothing is what hid the Windows TS tests).
      - name: test guard trips on an empty filter
        shell: bash
        run: |
          if node scripts/run-ts-tests.mjs --filter=@nonexistent/pkg; then
            echo "guard did not fail on an empty filter"; exit 1
          fi
      # The release scripts (harness-release.yml): payload assembly and release-native.json.
      - run: node --experimental-strip-types --test --test-timeout=120000 "scripts/release/test/*.test.ts"
        timeout-minutes: 5
      # The Windows one-liner, install.ps1, against a local file:// release (Linux and macOS run install.sh in the
      # system job).
      - if: runner.os == 'Windows'
        run: node --experimental-strip-types --test --test-timeout=120000 tests/system/install-scripts.test.ts
        timeout-minutes: 5
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tokenizer setup regression tests
        if: needs.changes.outputs.rust == 'true'
        run: node --test scripts/tokens/*.test.mjs
      - name: pinned tokenizer cache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/plur1bus-tokenizers
          key: tokenizers-v1-${{ hashFiles('crates/plur1bus-engine/src/tokens/artifacts.json', 'scripts/tokens/tiktoken-to-json.mjs') }}
      - name: install pinned tokenizer files
        if: needs.changes.outputs.rust == 'true'
        run: node scripts/tokens/setup-tokenizers.mjs
        timeout-minutes: 10
        env:
          PLUR1BUS_TOKENIZER_DIR: ${{ runner.temp }}/plur1bus-tokenizers
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace --no-fail-fast
        timeout-minutes: 30
        env:
          PLUR1BUS_TOKENIZER_DIR: ${{ runner.temp }}/plur1bus-tokenizers
  # Not gated: macOS (Core qualification remains unproven) and Windows (slow) legs, named as before, `unit (macos-15)` etc.
  # Every leg here is non-Linux, so the whole job follows the full-platform policy (`changes.macos`: push to main, schedule,
  # dispatch, label `ci:macos`, platform-sensitive paths; docs/ci.md) instead of excluding matrix entries (an all-excluded
  # matrix is not used). The Linux leg is `unit` above. Windows runs Core in `core-unit-shard-windows` below, as Ubuntu does.
  unit-os:
    name: unit (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true') && needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hang fails fast: the job has a ceiling, and each long test step its own, below it.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 90 || 65 }}
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_TOKENIZER_FILES_REQUIRED: "1"
      # PLUR1BUS_TOKENIZER_DIR is set on the steps that use it: a job's env has no `runner` context, and GitHub rejects
      # the whole workflow file when one is referenced there.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      # The coding-gate verifier and the D106 sandbox run commands under bubblewrap on Linux and fail
      # closed without it (owner decision 2026-10-17). Ubuntu 24.04 also restricts unprivileged user
      # namespaces through AppArmor, which bwrap needs; lift that for the test run only.
      - name: install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true && echo "bwrap ok"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-toolchain.mjs
      - run: node --test scripts/check-toolchain.test.mjs
      - name: config fixture drift (before generation)
        run: node packages/config-schema/src/gen-defaults.mjs --check
      - run: pnpm gen
      - run: pnpm build
      # A cold full-program strict check needs >2 GiB (incremental only saves warm runs).
      # Preserve the same compiler inputs/options; give V8 headroom on the 7 GiB macOS runner.
      - run: node packages/config-schema/src/gen-defaults.mjs --check && pnpm lint
        env:
          NODE_OPTIONS: ${{ runner.os == 'macOS' && '--max-old-space-size=4096' || '' }}
      - name: reasoning metadata schema and coverage hints
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/check-reasoning-metadata.mjs
      - name: unit tests with file timings
        if: needs.changes.outputs.ts-core == 'true'
        shell: bash
        run: |
          export TEST_TIMING_DIR="$GITHUB_WORKSPACE/test-timings"
          reporter="$(node -e 'console.log(require("node:url").pathToFileURL(process.cwd() + "/scripts/release/timing-reporter.mjs").href)')"
          export NODE_OPTIONS="--test-reporter=$reporter --test-reporter-destination=stdout"
          if [ "$RUNNER_OS" = Windows ]; then
            # The Core files run exactly once in core-unit-shard-windows; every other package stays here.
            node scripts/run-ts-tests.mjs --filter=!@plur1bus/core
          else
            pnpm test
          fi
        timeout-minutes: ${{ matrix.os == 'windows-2025' && 35 || 25 }}
        env:
          # macOS finds the system Chrome and would run packages/web's whole browser suite in-line (20+ min, so the step
          # timed out before core ran). Off here by this explicit switch, never by dropping the Chrome path; the suites
          # run in `web-browser-macos` below (docs/ci.md). Linux (no Chromium here) and Windows are unchanged.
          PLUR1BUS_WEB_BROWSER: ${{ runner.os == 'macOS' && 'off' || '' }}
      - name: slowest 20 test files
        if: always() && needs.changes.outputs.ts-core == 'true'
        run: node scripts/release/timing-summary.mjs test-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.ts-core == 'true'
        with:
          name: test-timings-${{ matrix.os }}
          path: test-timings/
          if-no-files-found: error
      # The vacuous-run guard must trip on every OS (a filter that matches nothing is what hid the Windows TS tests).
      - name: test guard trips on an empty filter
        shell: bash
        run: |
          if node scripts/run-ts-tests.mjs --filter=@nonexistent/pkg; then
            echo "guard did not fail on an empty filter"; exit 1
          fi
      # The release scripts (harness-release.yml): payload assembly and release-native.json.
      - run: node --experimental-strip-types --test --test-timeout=120000 "scripts/release/test/*.test.ts"
        timeout-minutes: 5
      # The Windows one-liner, install.ps1, against a local file:// release (Linux and macOS run install.sh in the
      # system job).
      - if: runner.os == 'Windows'
        run: node --experimental-strip-types --test --test-timeout=120000 tests/system/install-scripts.test.ts
        timeout-minutes: 5
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tokenizer setup regression tests
        if: needs.changes.outputs.rust == 'true'
        run: node --test scripts/tokens/*.test.mjs
      - name: pinned tokenizer cache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/plur1bus-tokenizers
          key: tokenizers-v1-${{ hashFiles('crates/plur1bus-engine/src/tokens/artifacts.json', 'scripts/tokens/tiktoken-to-json.mjs') }}
      - name: install pinned tokenizer files
        if: needs.changes.outputs.rust == 'true'
        run: node scripts/tokens/setup-tokenizers.mjs
        timeout-minutes: 10
        env:
          PLUR1BUS_TOKENIZER_DIR: ${{ runner.temp }}/plur1bus-tokenizers
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace --no-fail-fast
        timeout-minutes: 30
        env:
          PLUR1BUS_TOKENIZER_DIR: ${{ runner.temp }}/plur1bus-tokenizers
  core-unit-shard:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.ts-core == 'true'
    name: core unit shard ${{ matrix.shard }}/3 (ubuntu-24.04)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLUR1BUS_TEST_SHARD: ${{ matrix.shard }}/3
      PLUR1BUS_TEST_SHARD_TIMINGS: ${{ github.workspace }}/.github/ci/core-test-timings.json
      PLUR1BUS_TEST_SHARD_MANIFEST: ${{ github.workspace }}/core-unit-manifest-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - run: pnpm gen && pnpm build
      - name: install bubblewrap for the same Linux sandbox assertions
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true
      - name: measured Core shard
        timeout-minutes: 15
        shell: bash
        run: |
          export TEST_TIMING_DIR="$GITHUB_WORKSPACE/core-test-timings"
          reporter="$(node -e 'console.log(require("node:url").pathToFileURL(process.cwd() + "/scripts/release/timing-reporter.mjs").href)')"
          export NODE_OPTIONS="--test-reporter=$reporter --test-reporter-destination=stdout"
          pnpm --filter @plur1bus/core test
      - name: slowest Core files in this shard
        if: always()
        run: node scripts/release/timing-summary.mjs core-test-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-unit-manifest-${{ matrix.shard }}
          path: core-unit-manifest-${{ matrix.shard }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-timings-ubuntu-24.04-${{ matrix.shard }}
          path: core-test-timings/
          if-no-files-found: error

  core-unit:
    needs: [changes, core-unit-shard]
    if: always() && needs.changes.outputs.proceed == 'true' && needs.changes.outputs.ts-core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-unit-manifest-*
          path: core-unit-manifests
      - name: every Core test file ran in exactly one shard
        run: node scripts/ci/test-shards.mjs verify --cwd=packages/core --dir=core-unit-manifests
      - name: every Core shard succeeded
        if: always()
        env:
          SHARDS: ${{ needs.core-unit-shard.result }}
        run: test "$SHARDS" = success

  # Not gated: the Windows half of the Core split. windows-2025 needs about 4.4 s per Core test file (main run 40116614656:
  # 343 of the 666 files in 25 minutes), so `unit (windows-2025)`'s whole-workspace run hit its 35-minute step limit with
  # Core half done. `unit-os` now leaves Core out on Windows, as `unit` does on Ubuntu, and these shards run it with the
  # same measured partition as `core-unit-shard`, under the full-platform policy that also selects `unit-os`. Their
  # manifests and timings use names that the Ubuntu `core-unit` download pattern cannot match.
  core-unit-shard-windows:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.ts-core == 'true' && needs.changes.outputs.macos == 'true'
    name: core unit shard ${{ matrix.shard }}/3 (windows-2025)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PLUR1BUS_TEST_SHARD: ${{ matrix.shard }}/3
      PLUR1BUS_TEST_SHARD_TIMINGS: ${{ github.workspace }}/.github/ci/core-test-timings.json
      PLUR1BUS_TEST_SHARD_MANIFEST: ${{ github.workspace }}/windows-core-unit-manifest-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - run: pnpm gen && pnpm build
      # About 222 files, so about 16 minutes at that rate; the budget leaves room for a slow runner.
      - name: measured Core shard
        timeout-minutes: 30
        shell: bash
        run: |
          export TEST_TIMING_DIR="$GITHUB_WORKSPACE/core-test-timings"
          reporter="$(node -e 'console.log(require("node:url").pathToFileURL(process.cwd() + "/scripts/release/timing-reporter.mjs").href)')"
          export NODE_OPTIONS="--test-reporter=$reporter --test-reporter-destination=stdout"
          pnpm --filter @plur1bus/core test
      - name: slowest Core files in this shard
        if: always()
        run: node scripts/release/timing-summary.mjs core-test-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-core-unit-manifest-${{ matrix.shard }}
          path: windows-core-unit-manifest-${{ matrix.shard }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-timings-windows-2025-${{ matrix.shard }}
          path: core-test-timings/
          if-no-files-found: error

  # Not gated, like the shards it checks: every Core file ran in exactly one Windows shard, and every shard succeeded.
  core-unit-windows:
    needs: [changes, core-unit-shard-windows]
    if: always() && needs.changes.outputs.proceed == 'true' && needs.changes.outputs.ts-core == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-core-unit-manifest-*
          path: windows-core-unit-manifests
      - name: every Core test file ran in exactly one Windows shard
        run: node scripts/ci/test-shards.mjs verify --cwd=packages/core --dir=windows-core-unit-manifests
      - name: every Windows Core shard succeeded
        if: always()
        env:
          SHARDS: ${{ needs.core-unit-shard-windows.result }}
        run: test "$SHARDS" = success

  system:
    needs: [changes, unit]
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        exclude: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '[]' || '[{"os":"macos-15"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      # X1 Task 14: the extension fixtures (signed and tampered packages, the module fixture) are generated per run with a
      # throwaway in-memory key; only its public half reaches the tests, through pubkeys.env. Nothing is committed.
      - name: extension fixtures
        shell: bash
        run: cargo run -q -p plur1bus-ext --features testkit --example make-fixtures -- "$RUNNER_TEMP/p1x-fx"
      # Explicit file list; the system job stays Linux/macOS (Windows system tests wait for engine PR-11, spec §3).
      - run: node --experimental-strip-types --test --test-timeout=120000 tests/system/two-session-recall.test.ts tests/system/memory-ops.test.ts tests/system/reconnect.test.ts tests/system/config-restart.test.ts tests/system/modules.test.ts tests/system/admin.test.ts tests/system/setup.test.ts tests/system/install-scripts.test.ts tests/system/extensions.test.ts tests/system/turn-pipeline.test.ts tests/system/reembed.test.ts tests/e2e/smoke.test.ts
        timeout-minutes: 10
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_CI_RECALL_HARD_MS: "3000", PLUR1BUS_EXT_FIXTURES: "${{ runner.temp }}/p1x-fx" } # H3-R26: shared runners are not reference hardware
      # H3-R22: the same acceptance with a cold flat embedder (the first 2 query embeddings of each core process take
      # 350 ms, one at a time), so a recall that does not wait for the model warm-up overruns the 600 ms hard budget.
      - name: two-session recall (cold flat embedder)
        run: node --experimental-strip-types --test --test-timeout=120000 tests/system/two-session-recall.test.ts
        timeout-minutes: 5
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SYSTEM_INTERNALS: flat-embedder-cold, PLUR1BUS_CI_RECALL_HARD_MS: "3000" }
      # Criterion 2 (S16, ruling H3-R19): 200 turns over 2 agents with random core kills and two supervisor kills;
      # the nightly runs 1 000. The seed is printed; replay a failure with PLUR1BUS_SOAK_SEED.
      - name: kill soak (200 turns)
        run: node --experimental-strip-types --test --test-timeout=600000 tests/system/kill-soak.test.ts
        timeout-minutes: 15
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SOAK_TURNS: "200" }
      - run: pnpm bench
  # M3 criteria 7/9: required after the complete pinned-Chromium local baseline and late authorization checks passed.
  # Owner decision 2026-10-18: the browser suite runs as four shards behind one gate job. `web-browser-build` compiles
  # the current-branch CLI once (the expensive Rust step) and hands it to the shards as an artifact; each shard runs the
  # cheap esbuild `pnpm gen && pnpm build` itself, installs the lockfile-matched Chromium (browser files cached by
  # lockfile hash) and runs its round-robin share of packages/web/test (scripts/ci/test-shards.mjs). The `web-browser`
  # job keeps the check name the merge gate uses: it fails unless plan, build and every shard succeeded, and its shard
  # check proves from the manifests the shards wrote that every test file ran exactly once.
  web-browser-build:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: build Core and CLI for served-stack browser acceptance
        run: pnpm gen && pnpm build && pnpm typecheck && cargo build -p plur1bus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-cli
          path: target/debug/plur1bus
          if-no-files-found: error
          retention-days: 1
  web-browser-shard:
    name: web-browser shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: [changes, web-browser-build]
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        total: [4]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLUR1BUS_WEB_E2E_REQUIRED: "1"
      PLUR1BUS_WEB_TRANSPORT_REQUIRED: "1"
      PLUR1BUS_BIN: ${{ github.workspace }}/target/debug/plur1bus
      PLUR1BUS_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
      PLUR1BUS_TEST_SHARD_MANIFEST: ${{ github.workspace }}/web-browser-shard-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: build Core (esbuild; the CLI comes from web-browser-build)
        run: pnpm gen && pnpm build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-browser-cli
          path: target/debug
      - name: current-branch CLI from web-browser-build
        run: chmod +x "$PLUR1BUS_BIN" && "$PLUR1BUS_BIN" --version
      # The browser files are keyed by the lockfile (it pins Playwright and so the Chromium revision); the install step
      # below still runs, adds the Linux libraries and downloads the browser on a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: install lockfile-matched Chromium and Linux libraries
        run: pnpm --filter @plur1bus/web exec playwright install --with-deps chromium
      - name: web browser suites (axe, keyboard, contrast, responsive and zoom), this shard's files
        run: pnpm --filter @plur1bus/web test
        timeout-minutes: 35
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-browser-shard-manifest-${{ matrix.shard }}
          path: web-browser-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
  # The macOS half of the browser suite (the `unit (macos-15)` job turns it off with PLUR1BUS_WEB_BROWSER=off). Runs where
  # the other macOS legs run (changes.macos: push to main, schedule, dispatch, label `ci:macos`, platform-sensitive
  # paths), additionally requiring web=true. Explicit advisory ci-gate dependency: completed failures do not block,
  # but the gate waits for the outcome. The required `web-browser` aggregate stays Linux-only. Two shards
  # (macOS runner minutes are scarce, docs/ci.md); lockfile-matched Chromium like the Linux shards. The served-stack tests
  # (real-transport, real-accounts, surfaces-e2e) need the Rust CLI and stay with the Linux shards: they skip here with a reason.
  web-browser-macos:
    name: web-browser (macos-15, ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.web == 'true' && needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        total: [2]
        shard: [1, 2]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_WEB_E2E_REQUIRED: "1"
      PLUR1BUS_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen && pnpm build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: install lockfile-matched Chromium
        run: pnpm --filter @plur1bus/web exec playwright install chromium
      - name: web browser suites on macOS (axe, keyboard, contrast, responsive and zoom), this shard's files
        run: pnpm --filter @plur1bus/web test
        timeout-minutes: 45
  web-browser:
    needs: [changes, web-browser-build, web-browser-shard]
    if: always() && needs.changes.outputs.proceed == 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.proceed == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.proceed == 'true'
        with: { node-version: 24.21.0 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.proceed == 'true'
        with:
          pattern: web-browser-shard-manifest-*
          path: web-browser-manifests
      - name: every web test file ran in exactly one shard
        if: needs.changes.outputs.proceed == 'true'
        run: |
          node --test scripts/ci/test-shards.test.mjs
          node scripts/ci/test-shards.mjs verify --cwd=packages/web --dir=web-browser-manifests
      - name: plan, build and every shard succeeded
        if: always()
        env:
          PLAN: ${{ needs.changes.result }}
          PROCEED: ${{ needs.changes.outputs.proceed }}
          BUILD: ${{ needs.web-browser-build.result }}
          SHARDS: ${{ needs.web-browser-shard.result }}
        run: |
          if [ "$PLAN" != success ]; then echo "::error::plan job: $PLAN"; exit 1; fi
          if [ "$PROCEED" != true ]; then echo "plan.proceed is not true for this event: no browser run, nothing to gate"; exit 0; fi
          if [ "$BUILD" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::web-browser-build: $BUILD, web-browser-shard (all shards): $SHARDS"
            exit 1
          fi
          echo "web-browser-build and all shards succeeded"
  # OS service registration against the real service manager (Task 8, criterion 9): systemd user instance, launchd
  # GUI domain, Task Scheduler. Every registration uses the temp home's suffixed name (S10) and is removed again.
  # Ruling C5: Linux needs a user manager (lingering); if enabling it fails, the job keeps the unit-file tests
  # (tests/service.rs) and the real test runs on the owner's Ubuntu VM instead.
  service:
    needs: [changes, unit]
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        exclude: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '[]' || '[{"os":"macos-15"},{"os":"windows-2025"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release -p plur1bus
      - run: cargo test --release -p plur1bus --test service
        timeout-minutes: 5
      - name: user service manager
        id: manager
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then echo "real=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          uid="$(id -u)"
          if sudo loginctl enable-linger "$USER"; then
            for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
          fi
          if [ -S "/run/user/$uid/bus" ] && XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user list-units >/dev/null 2>&1; then
            echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no systemd user manager on this runner (loginctl enable-linger failed); the real service test runs on the owner's VM (ruling C5)"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.manager.outputs.real == 'true'
        run: cargo test --release -p plur1bus --test service_real -- --test-threads=1
        timeout-minutes: 10
        env: { PLUR1BUS_SERVICE_TEST: "1" }
  # HM2 Task 6: the Python client (Tasks 2, 3) and the Hermes provider (Task 5) offline, then live against a
  # flat-embedder core built from this commit (no model download). windows-2025 is the gate for Task 3 (ruling F20):
  # the six NamedPipeTest real-pipe tests must run there, not skip. windows-11-arm is informational.
  python-host:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true' || needs.changes.outputs.python == 'true')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational == true }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - name: dev requirements (hash-pinned, in a venv)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/venv/Scripts/python.exe"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install --require-hashes -r clients/python/plur1bus-memory-client/requirements-dev.txt
          echo "PY=$py" >> "$GITHUB_ENV"
      - name: client offline (Tasks 2, 3)
        shell: bash
        timeout-minutes: 10
        run: '"$PY" hosts/hermes/tests/run_with_timeout.py discover -v -s clients/python/plur1bus-memory-client/tests -t clients/python/plur1bus-memory-client'
      - name: real named pipes ran (Task 3 gate, F20)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: clients/python/plur1bus-memory-client
        run: |
          "$PY" - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_transport_win.NamedPipeTest")
          r = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"NamedPipeTest: ran {r.testsRun}, skipped {len(r.skipped)}, failures {len(r.failures)}, errors {len(r.errors)}")
          sys.exit(0 if r.wasSuccessful() and r.testsRun == 6 and not r.skipped else 1)
          PY
      - name: provider offline (Task 5)
        shell: bash
        timeout-minutes: 10
        run: '"$PY" hosts/hermes/tests/run_with_timeout.py discover -v -s hosts/hermes/tests -t hosts/hermes'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The engine read token exists in this step only; the git@github.com: -> HTTPS rewrite is step-scoped
      # (GIT_CONFIG_*), never the global gitconfig, so the test steps after it never see the token.
      - name: build plur1bus and the core
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      # PLUR1BUS_LIVE_REQUIRED: a live suite that cannot run fails here instead of skipping.
      - name: live RPC conformance and provider against a real core
        shell: bash
        timeout-minutes: 15
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe" PLUR1BUS_CORE_JS="$GITHUB_WORKSPACE/packages/core/dist/core.js"
          "$PY" hosts/hermes/tests/run_with_timeout.py discover -v -s clients/python/plur1bus-memory-client/tests/live -t clients/python/plur1bus-memory-client
          "$PY" hosts/hermes/tests/run_with_timeout.py discover -v -s hosts/hermes/tests/e2e -t hosts/hermes
        env: { PLUR1BUS_LIVE_REQUIRED: "1", PLUR1BUS_CI_RECALL_HARD_MS: "3000" } # H3-R26: shared runners are not reference hardware
  wsl:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true' || needs.changes.outputs.python == 'true')
    # Cross-platform migration WSL discovery and tar snapshot job (spec §B.7, gap G5/G6, decision C8).
    # Required blocking job for M7 acceptance; runs on windows-2025.
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup WSL (attempt 1 of 3)
        id: wsl_setup_1
        continue-on-error: true
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: root
          wsl-conf: |
            [user]
            default=root
      - name: wait before WSL setup retry 2
        if: steps.wsl_setup_1.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 5
      - name: setup WSL (attempt 2 of 3)
        id: wsl_setup_2
        if: steps.wsl_setup_1.outcome == 'failure'
        continue-on-error: true
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: root
          wsl-conf: |
            [user]
            default=root
      - name: wait before WSL setup retry 3
        if: steps.wsl_setup_2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 15
      - name: setup WSL (attempt 3 of 3)
        id: wsl_setup_3
        if: steps.wsl_setup_2.outcome == 'failure'
        continue-on-error: true
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: root
          wsl-conf: |
            [user]
            default=root
      - name: report WSL setup status
        id: wsl_setup_status
        if: always()
        shell: bash
        env:
          ATTEMPT_1: ${{ steps.wsl_setup_1.outcome }}
          ATTEMPT_2: ${{ steps.wsl_setup_2.outcome }}
          ATTEMPT_3: ${{ steps.wsl_setup_3.outcome }}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### WSL setup infrastructure failure"
              echo "WSL setup failed after three attempts. This is a runner/WSL infrastructure failure; WSL tests were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::WSL setup failed after three attempts; infrastructure gate failed."
            exit 1
          fi
      - if: steps.wsl_setup_status.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - if: steps.wsl_setup_status.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - if: steps.wsl_setup_status.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.wsl_setup_status.outputs.ready == 'true'
        run: pnpm gen
      - if: steps.wsl_setup_status.outputs.ready == 'true'
        run: pnpm build
      - name: create synthetic openclaw fixture in WSL
        if: steps.wsl_setup_status.outputs.ready == 'true'
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          mkdir -p /root/.openclaw/ws-wsl/skills/notes /root/.ssh
          echo "secret-ssh-token" > /root/.ssh/id_rsa
          ln -s /root/.ssh/id_rsa /root/.openclaw/ws-wsl/skills/notes/leaked_key
          cat <<'JSON' > /root/.openclaw/openclaw.json
          {
            "meta": { "lastTouchedVersion": "2026.9.5" },
            "agents": { "list": [ { "id": "wsl-agent", "workspace": "/root/.openclaw/ws-wsl" } ] }
          }
          JSON
          cat <<'SKILL' > /root/.openclaw/ws-wsl/skills/notes/SKILL.md
          ---
          name: notes
          description: WSL test notes
          ---
          # notes
          SKILL
          test -f /root/.openclaw/openclaw.json
      - name: synthetic WSL source and import detect
        if: steps.wsl_setup_status.outputs.ready == 'true'
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          # Verify fixture exists inside distro
          wsl.exe -d Ubuntu-24.04 -e test -f /root/.openclaw/openclaw.json || { echo "Fixture creation failed in WSL"; exit 1; }

          # Run detect with --probe-wsl against the WSL candidate from the Windows host
          out1=$(node packages/core/dist/import.js openclaw --detect --home "$RUNNER_TEMP/harness-home" --probe-wsl)
          echo "$out1"
          echo "$out1" | grep -q "Ubuntu-24.04" || { echo "WSL candidate Ubuntu-24.04 not found in candidate list"; exit 1; }

          # Run direct detect against wsl: syntax
          out2=$(node packages/core/dist/import.js openclaw --detect --source "wsl:Ubuntu-24.04:/root/.openclaw" --home "$RUNNER_TEMP/harness-home")
          echo "$out2"
          echo "$out2" | grep -q "wsl-agent" || { echo "wsl-agent not found in detect output"; exit 1; }
          echo "$out2" | grep -q "notes" || { echo "skill notes not found in detect output"; exit 1; }

          # Run snapshot creation against real WSL and assert external symlink was skipped (F1, N1)
          node --experimental-strip-types -e '
          import { createSnapshot } from "./packages/core/src/import/snapshot.ts";
          const res = await createSnapshot({
            sourceType: "openclaw",
            source: "wsl:Ubuntu-24.04:/root/.openclaw",
            home: process.env.RUNNER_TEMP + "/harness-home",
            probeWsl: true,
          });
          console.log("Snapshot stagingDir:", res.stagingDir);
          console.log("Skipped links:", res.metadata.skippedLinks);
          if (!res.metadata.skippedLinks || !res.metadata.skippedLinks.some((l) => l.includes("leaked_key"))) {
            console.error("Expected leaked_key to be in skippedLinks!", res.metadata.skippedLinks);
            process.exit(1);
          }
          '
          if grep -rq "secret-ssh-token" "$RUNNER_TEMP/harness-home"; then
            echo "SECURITY VIOLATION: secret from outside WSL source root leaked into harness staging"
            exit 1
          fi

  release-scripts:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - run: node --test scripts/release/test/*.test.mjs scripts/ci/cache-policy.test.mjs
      - run: node --test scripts/ci/timings.test.mjs
      - name: install pinned actionlint (setup only)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: lint workflows locally
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck= -config-file scripts/release/actionlint.yaml .github/workflows/*.yml'

  sandbox:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    name: sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
        exclude: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '[]' || '[{"os":"macos-15"},{"os":"windows-2025"},{"os":"windows-11-arm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build -p plur1bus --bin plur1bus-sandbox-limits
      - name: install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true && echo "bwrap ok"
      - name: kernel sandbox adversarial probes (explicit skip when unavailable)
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning --test --test-concurrency=1 packages/core/test/tools/sandbox/sandbox.test.ts

  host-tool-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: generate RPC schema types
        run: node packages/rpc-schema/src/build.mjs
      - name: deterministic host tool/policy scenarios (safe fake OS ports)
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/tool-eval-host.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with: { name: host-tool-eval-fixture, path: artifacts/tool-eval/ }

  # Independent advisory job. Existing jobs/gates are intentionally untouched.
  perf-startup:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    name: startup (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # `exclude` cannot remove `include` entries, so the non-Linux legs are chosen by the full-platform policy here.
        include: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '[{"os":"macos-15","target":"darwin-arm64"},{"os":"windows-2025","target":"win32-x64"},{"os":"windows-11-arm","target":"win32-arm64"},{"os":"ubuntu-24.04","target":"linux-x64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"}]' || '[{"os":"ubuntu-24.04","target":"linux-x64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: '1.95' }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: install pinned dependencies
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          base="https://github.com/"
          if [ -n "$GH_ENGINE_READ_TOKEN" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; fi
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="url.${base}.insteadOf" GIT_CONFIG_VALUE_0='git@github.com:'
          export GIT_CONFIG_KEY_1="url.${base}.insteadOf" GIT_CONFIG_VALUE_1='ssh://git@github.com/'
          export GIT_CONFIG_KEY_2="url.${base}.insteadOf" GIT_CONFIG_VALUE_2='https://github.com/'
          pnpm install --frozen-lockfile
      - run: pnpm prep
      - run: cargo build --release -p plur1bus
      - name: help isolation and measurement tests
        run: node --experimental-strip-types --conditions=source --test --test-concurrency=1 tests/system/help-isolation.test.ts scripts/bench/metrics.test.mjs scripts/bench/startup.test.mjs
      - name: measure B1 B8 B11 (30 starts, advisory timings)
        env:
          PERF_RUNNER_LABEL: ${{ matrix.os }}
        run: node scripts/bench/startup.mjs --runs 30 --out startup-benchmark
      # The excluded first start of the real-model run downloads and loads the default models; without a cache that happens on
      # every run (the stall behind `core.status timed out`). The key follows the default-model catalog (engine-config.ts); the
      # directory is inside the workspace because hashFiles() below only reads there. Saved only after a green run, so a
      # half-downloaded cache is never stored.
      - name: restore model cache
        id: perf-models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: perf-models-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('packages/core/src/engine-config.ts') }}
      - name: measure B8 with background model warming (advisory)
        env:
          PERF_RUNNER_LABEL: ${{ matrix.os }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.models-cache"
          node scripts/bench/startup.mjs --runs 30 --real-models --models-cache "$GITHUB_WORKSPACE/.models-cache" --out startup-models
      - name: save model cache
        if: ${{ success() && steps.perf-models.outputs.cache-hit != 'true' && hashFiles('.models-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: ${{ steps.perf-models.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: startup-${{ matrix.target }}
          path: |
            startup-benchmark.json
            startup-benchmark.md
            startup-models.json
            startup-models.md
          if-no-files-found: warn

  perf-budgets:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts-core == 'true')
    name: budget catalogue (${{ matrix.os }}, advisory)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
        exclude: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '[]' || '[{"os":"macos-15"},{"os":"windows-2025"},{"os":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: '1.95' }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: install pinned dependencies
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          base="https://github.com/"
          if [ -n "$GH_ENGINE_READ_TOKEN" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; fi
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="url.${base}.insteadOf" GIT_CONFIG_VALUE_0='git@github.com:'
          export GIT_CONFIG_KEY_1="url.${base}.insteadOf" GIT_CONFIG_VALUE_1='ssh://git@github.com/'
          export GIT_CONFIG_KEY_2="url.${base}.insteadOf" GIT_CONFIG_VALUE_2='https://github.com/'
          pnpm install --frozen-lockfile
      - run: pnpm prep
      - run: cargo build --release -p plur1bus
      - name: O6 dry hardware baseline (known incomplete coverage is explicit)
        shell: bash
        run: |
          set +e
          node scripts/bench/reference-hardware.mjs --out reference-ci
          result=$?
          if [ "$result" = 2 ]; then
            echo '::warning::Reference collector reports known incomplete B10 coverage / B5 miss; see JSON and Markdown. No gate promotion.'
          else
            exit "$result"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: budgets-${{ matrix.os }}
          path: |
            reference-ci.json
            reference-ci.md
          if-no-files-found: error

  # D100 golden set (separate, append-only job): render one document per template and compare against the committed
  # references (visual diff). Chrome is pinned (CHROME_VERSION) because the references are only comparable to renders of that
  # build; byte-identical PNGs are not stable across versions, so pages are compared pixel-wise: per-channel tolerance 8/255,
  # at most 0.1 % differing pixels per page (see docs/documents.md). References live in packages/documents/golden/. Every run
  # uploads its renders as artifact `golden-renders`; new references are adopted from there with `golden.ts update --from`.
  documents-golden:
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      CHROME_VERSION: 141.0.7390.54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with: { chrome-version: "${{ env.CHROME_VERSION }}" }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen && pnpm --filter @plur1bus/documents build
      - name: "golden set visual diff (pixel threshold)"
        shell: bash
        env:
          PLUR1BUS_CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          PLUR1BUS_GOLDEN_OUT: ${{ runner.temp }}/golden-renders
        run: |
          export PLUR1BUS_CHROMIUM_BIN="${PLUR1BUS_CHROMIUM_BIN:-$(command -v chrome || command -v google-chrome || command -v chromium || true)}"
          node --experimental-strip-types --conditions=source packages/documents/scripts/golden.ts check
      - name: upload golden renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-renders
          path: ${{ runner.temp }}/golden-renders
          if-no-files-found: warn
          retention-days: 14

  docs-hygiene:
    needs: changes
    if: needs.changes.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: node packages/config-schema/src/gen-defaults.mjs --check
      - run: pnpm gen && pnpm build
      - name: hygiene and documentation checks
        run: |
          node scripts/lint-hygiene.mjs
          node scripts/release/check-source-quality.mjs
          node scripts/check-i18n.mjs
          node --test scripts/lint-hygiene.test.mjs scripts/check-doc-links.test.mjs scripts/check-docs-commands.test.mjs scripts/bundle-user-docs.test.mjs
          pnpm docs:check

  # macOS browser is an explicit advisory dependency: wait for its outcome, accept completed failures/skips.
  # THE gate: the one check to wait for (docs/ci.md, CLAUDE.md). Its required set is (scripts/ci/gate.mjs:
  # docs-hygiene, `unit` = ubuntu-24.04, Core shards/partition, wsl, and the `web-browser` aggregate over the browser build and every shard). Slow,
  # flaky or experimental jobs are deliberately not in `needs` (`unit-os`, system, service, python-host, sandbox, startup and
  # budget advisories, ...): the gate would otherwise wait for them. A non-macOS label event is a no-op run (`changes` sets
  # proceed=false); its gate is named differently so that it can never stand in for the `ci-gate` of the real run of the
  # same head commit, and the concurrency group above keeps it from cancelling that run.
  ci-gate:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:macos') && 'ci-gate (label no-op)' || 'ci-gate' }}
    needs: [changes, docs-hygiene, unit, core-unit-shard, core-unit, wsl, web-browser, web-browser-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - name: explicit selections and dependency outcomes
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
