name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bge-native-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Install the pinned engine
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
          unset GH_ENGINE_READ_TOKEN base
          pnpm --filter @plur1bus/core... install --frozen-lockfile
      - name: Record BGE on native Ubuntu x64
        env:
          PLUR1BUS_MODELS_CACHE: ${{ runner.temp }}/bge-models
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          out="$RUNNER_TEMP/bge-recording"
          mkdir -p "$out"
          LC_ALL=C lscpu | awk '/^(Architecture|Vendor ID|Model name|Flags):/' > "$out/processor.txt"
          node --experimental-strip-types --conditions=source crates/plur1bus-engine/tests/fixtures/vectors/record.mjs --bge --output-dir "$out"
          node --input-type=module - "$out/bge-scores.json" <<'NODE'
          import {readFileSync} from 'node:fs'
          const fresh = JSON.parse(readFileSync(process.argv[2]))
          const original = JSON.parse(readFileSync('crates/plur1bus-engine/tests/fixtures/vectors/bge-scores.json'))
          const deltas = fresh.pairs.map((row, i) => Math.abs(row.score - original.pairs[i].score))
          console.log(JSON.stringify({
            identity: fresh.identity,
            pair24: fresh.pairs[24].score,
            maxAbsoluteDelta: Math.max(...deltas),
            beyondTolerance: deltas.filter(delta => delta > 0.001).length,
            rankings: fresh.rankingCases.map(row => row.order ?? row.hits),
          }))
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ry-b-bge-native-x64
          path: ${{ runner.temp }}/bge-recording/
          if-no-files-found: error
          retention-days: 7
