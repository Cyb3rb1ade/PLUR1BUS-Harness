name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hang fails fast: the job has a ceiling, and each long test step its own, below it.
    timeout-minutes: 45
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - name: Isolate UI test browser storage
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/plur1bus-playwright" >> "$GITHUB_ENV"
      - name: Install UI test browser (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @plur1bus/desktop-ui exec playwright install --with-deps chromium --only-shell
      - name: Install UI test browser (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter @plur1bus/desktop-ui exec playwright install chromium --only-shell
      - run: node scripts/check-toolchain.mjs
      - run: pnpm gen
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
        timeout-minutes: 15
      # The release scripts (harness-release.yml): payload assembly and release-native.json.
      - run: node --experimental-strip-types --test "scripts/release/test/*.test.ts"
        timeout-minutes: 5
      # The Windows one-liner, install.ps1, against a local file:// release (Linux and macOS run install.sh in the
      # system job).
      - if: runner.os == 'Windows'
        run: node --experimental-strip-types --test tests/system/install-scripts.test.ts
        timeout-minutes: 5
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        timeout-minutes: 20
      - run: pnpm docs:check
  system:
    needs: unit
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      # X1 Task 14: the extension fixtures (signed and tampered packages, the module fixture) are generated per run with a
      # throwaway in-memory key; only its public half reaches the tests, through pubkeys.env. Nothing is committed.
      - name: extension fixtures
        shell: bash
        run: cargo run -q -p plur1bus-ext --features testkit --example make-fixtures -- "$RUNNER_TEMP/p1x-fx"
      # Explicit file list; the system job stays Linux/macOS (Windows system tests wait for engine PR-11, spec §3).
      - run: node --experimental-strip-types --test tests/system/two-session-recall.test.ts tests/system/memory-ops.test.ts tests/system/reconnect.test.ts tests/system/config-restart.test.ts tests/system/modules.test.ts tests/system/admin.test.ts tests/system/setup.test.ts tests/system/install-scripts.test.ts tests/system/extensions.test.ts
        timeout-minutes: 10
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_CI_RECALL_HARD_MS: "3000", PLUR1BUS_EXT_FIXTURES: "${{ runner.temp }}/p1x-fx" } # H3-R26: shared runners are not reference hardware
      # H3-R22: the same acceptance with a cold flat embedder (the first 2 query embeddings of each core process take
      # 350 ms, one at a time), so a recall that does not wait for the model warm-up overruns the 600 ms hard budget.
      - name: two-session recall (cold flat embedder)
        run: node --experimental-strip-types --test tests/system/two-session-recall.test.ts
        timeout-minutes: 5
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SYSTEM_INTERNALS: flat-embedder-cold, PLUR1BUS_CI_RECALL_HARD_MS: "3000" }
      # Criterion 2 (S16, ruling H3-R19): 200 turns over 2 agents with random core kills and two supervisor kills;
      # the nightly runs 1 000. The seed is printed; replay a failure with PLUR1BUS_SOAK_SEED.
      - name: kill soak (200 turns)
        run: node --experimental-strip-types --test tests/system/kill-soak.test.ts
        timeout-minutes: 15
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SOAK_TURNS: "200" }
      - run: pnpm bench
  # OS service registration against the real service manager (Task 8, criterion 9): systemd user instance, launchd
  # GUI domain, Task Scheduler. Every registration uses the temp home's suffixed name (S10) and is removed again.
  # Ruling C5: Linux needs a user manager (lingering); if enabling it fails, the job keeps the unit-file tests
  # (tests/service.rs) and the real test runs on the owner's Ubuntu VM instead.
  service:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p plur1bus
      - run: cargo test --release -p plur1bus --test service
        timeout-minutes: 5
      - name: user service manager
        id: manager
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then echo "real=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          uid="$(id -u)"
          if sudo loginctl enable-linger "$USER"; then
            for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
          fi
          if [ -S "/run/user/$uid/bus" ] && XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user list-units >/dev/null 2>&1; then
            echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no systemd user manager on this runner (loginctl enable-linger failed); the real service test runs on the owner's VM (ruling C5)"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.manager.outputs.real == 'true'
        run: cargo test --release -p plur1bus --test service_real -- --test-threads=1
        timeout-minutes: 10
        env: { PLUR1BUS_SERVICE_TEST: "1" }
  # HM2 Task 6: the Python client (Tasks 2, 3) and the Hermes provider (Task 5) offline, then live against a
  # flat-embedder core built from this commit (no model download). windows-2025 is the gate for Task 3 (ruling F20):
  # the six NamedPipeTest real-pipe tests must run there, not skip. windows-11-arm is informational.
  python-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-15, python: "3.13" }
          - { os: windows-2025, python: "3.13" }
          - { os: windows-11-arm, python: "3.13", informational: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational == true }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: dev requirements (hash-pinned, in a venv)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/venv/Scripts/python.exe"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install --require-hashes -r clients/python/plur1bus-memory-client/requirements-dev.txt
          echo "PY=$py" >> "$GITHUB_ENV"
      - name: client offline (Tasks 2, 3)
        shell: bash
        timeout-minutes: 10
        run: '"$PY" -m unittest discover -v -s clients/python/plur1bus-memory-client/tests -t clients/python/plur1bus-memory-client'
      - name: real named pipes ran (Task 3 gate, F20)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: clients/python/plur1bus-memory-client
        run: |
          "$PY" - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_transport_win.NamedPipeTest")
          r = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"NamedPipeTest: ran {r.testsRun}, skipped {len(r.skipped)}, failures {len(r.failures)}, errors {len(r.errors)}")
          sys.exit(0 if r.wasSuccessful() and r.testsRun == 6 and not r.skipped else 1)
          PY
      - name: provider offline (Task 5)
        shell: bash
        timeout-minutes: 10
        run: '"$PY" -m unittest discover -v -s hosts/hermes/tests -t hosts/hermes'
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
      # The engine read token exists in this step only; the git@github.com: -> HTTPS rewrite is step-scoped
      # (GIT_CONFIG_*), never the global gitconfig, so the test steps after it never see the token.
      - name: build plur1bus and the core
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      # PLUR1BUS_LIVE_REQUIRED: a live suite that cannot run fails here instead of skipping.
      - name: live RPC conformance and provider against a real core
        shell: bash
        timeout-minutes: 15
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          export PLUR1BUS_BIN="$GITHUB_WORKSPACE/target/release/plur1bus$exe" PLUR1BUS_CORE_JS="$GITHUB_WORKSPACE/packages/core/dist/core.js"
          "$PY" -m unittest discover -v -s clients/python/plur1bus-memory-client/tests/live -t clients/python/plur1bus-memory-client
          "$PY" -m unittest discover -v -s hosts/hermes/tests/e2e -t hosts/hermes
        env: { PLUR1BUS_LIVE_REQUIRED: "1", PLUR1BUS_CI_RECALL_HARD_MS: "3000" } # H3-R26: shared runners are not reference hardware
