name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-toolchain.mjs
      - run: pnpm gen
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: pnpm docs:check
  system:
    needs: unit
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      - run: node --experimental-strip-types --test tests/system/two-session-recall.test.ts
        env: { PLUR1BUS_BIN: target/release/plur1bus }
      - run: pnpm bench
