name: nightly
# M1 acceptance 1 with real models, and the 1 000-turn kill soak (acceptance 2, flat embedder): the system test with the real e5-small embedder and the bge-reranker
# (PLUR1BUS_REAL_MODELS=1 asserts the reranker ran and did not fall back), plus the benchmark gates. The
# ~600 MB of models live in the core's <home>/models; the test links each temp home's models/ to
# PLUR1BUS_MODELS_CACHE, which is restored before and saved after the run (even a failed one).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      coding-baseline-capture:
        description: "Owner: capture B1 without an existing baseline (requires approved models and containment)"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  system-real-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_MODELS_CACHE: ${{ github.workspace }}/.models-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - name: restore model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: models-${{ runner.os }}-intfloat-multilingual-e5-small-woxpas-ai-bge-reranker-v2-m3-onnx-v1
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus -p plur1bus-tools
      - name: system test (real models)
        run: node --experimental-strip-types --test --test-timeout=300000 tests/system/two-session-recall.test.ts
        timeout-minutes: 30
        # H3-R26: shared CI runners are not reference hardware. The CI recall budget keeps a slow runner from
        # aborting the recall (degraded must still be null); the 400/600 ms targets are reported as diagnostics and
        # `::warning::` lines here, and asserted only on reference hardware (AGENTS.md, "Real-model acceptance").
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_REAL_MODELS: "1", PLUR1BUS_CI_RECALL_HARD_MS: "2000" }
      # Criterion 2 at full length (S16, ruling H3-R19): 1 000 turns over 10 agents, flat embedder (the soak is about
      # durability under kills, so it does not need the models).
      - name: kill soak (1 000 turns)
        # Runs even when the real-model system test failed: the two acceptances are independent.
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --test --test-timeout=1800000 tests/system/kill-soak.test.ts
        timeout-minutes: 60
        # Recall budget 3 s here (PR CI keeps 1 s): the 1 000-turn run grows each agent's table, and recall slows with
        # every LanceDB fragment (known engine follow-up); the soak prints per-third p95/max so the growth stays visible.
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SOAK_TURNS: "1000", PLUR1BUS_SOAK_RECALL_BUDGET_MS: "3000" }
      - run: pnpm bench
        timeout-minutes: 10
      - name: save model cache
        if: ${{ success() && steps.models.outputs.cache-hit != 'true' && hashFiles('.models-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: ${{ steps.models.outputs.cache-primary-key }}
  # M2 acceptance 13 (D95): the SearXNG provider against a live instance. Not gating and skipped unless the repository
  # variable PLUR1BUS_SEARXNG_LIVE_URL is set to an instance the sidecar rule admits (private, tailnet or loopback
  # address; a hosted runner can reach it only through a self-hosted runner or a service container). A red run opens the
  # usual nightly issue and blocks nothing.
  web-search-searxng-live:
    if: ${{ vars.PLUR1BUS_SEARXNG_LIVE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_SEARXNG_LIVE_URL: ${{ vars.PLUR1BUS_SEARXNG_LIVE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build
      - name: live SearXNG search
        working-directory: packages/core
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning --test --test-timeout=120000 test/live/web-search-searxng.test.ts
  # Spec 2026-09-27 §8.4/§12, acceptance 8: ten minutes of mutants of valid .p1x packages through the inspect pipeline
  # (no panic, no mutant accepted as first-party). The seed is printed; replay a failure with PLUR1BUS_FUZZ_SEED.
  ext-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: fuzz the inspect pipeline (600 s)
        run: PLUR1BUS_FUZZ_SECONDS=600 cargo test -p plur1bus-ext --features testkit --test fuzz -- --ignored --nocapture

  host-tool-eval-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: generate RPC schema types
        run: node packages/rpc-schema/src/build.mjs
      - name: live host-tool choice (safe fixture OS ports; missing credentials recorded as skipped)
        env:
          PLUR1BUS_HOST_EVAL_MODELS: ${{ vars.PLUR1BUS_HOST_EVAL_MODELS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PLUR1BUS_HOST_EVAL_OUT: artifacts/tool-eval
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/tool-eval-host.ts --live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: host-tool-eval-live, path: artifacts/tool-eval/ }

  # N-G2: real models through the actual turn provider; fixture effects cannot reach the host or network.
  turn-eval-live:
    if: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: generate RPC schema types
        run: node packages/rpc-schema/src/build.mjs
      # Credentials reach the evaluation only through the harness secret store (docs/turn-eval.md). This is the one step that
      # sees the secrets; the next one resolves them from the store of the short-lived eval home. Only these two vendors'
      # keys are passed to a scheduled job, and the evaluation refuses every OpenAI profile (D110).
      - name: store the provider keys in the eval home's secret store
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_TURN_EVAL_HOME: ${{ runner.temp }}/turn-eval-home
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/turn-eval-secrets.ts
      - name: real model tool and skill use through createTurnProvider
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_TURN_EVAL_HOME: ${{ runner.temp }}/turn-eval-home
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/turn-eval.ts --live --out artifacts/turn-eval/live-reports.json
      - name: remove the eval home
        if: always()
        run: rm -rf "${{ runner.temp }}/turn-eval-home"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: turn-eval-live, path: artifacts/turn-eval/ }

  coding-bench-plan:
    # The owner enables this only after a real B1 baseline and usable containment are available.
    if: ${{ (vars.PLUR1BUS_CODING_BENCH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.coding-baseline-capture)) && vars.PLUR1BUS_TURN_EVAL_MODELS != '' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - id: matrix
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
        # Only numeric indexes reach outputs. The run step applies the full approved model parser.
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          try {
            const models = JSON.parse(process.env.PLUR1BUS_TURN_EVAL_MODELS);
            if (!Array.isArray(models) || !models.length || models.length > 32) process.exit(1);
            const matrix = { model: models.map((_, index) => index) };
            appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          } catch { process.exit(1); }
          NODE

  coding-bench-smoke:
    needs: coding-bench-plan
    if: ${{ needs.coding-bench-plan.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.coding-baseline-capture }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.coding-bench-plan.outputs.matrix || '{"model":[0]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1", cache: false }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: install the existing verifier backend
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: generate types and build the native preflight binaries
        run: |
          pnpm gen
          cargo build --locked -p plur1bus-tools --bin plur1bus-tools
          cargo build --locked -p plur1bus --bin plur1bus-sandbox-limits
      - name: store provider keys and a runtime canary in the disposable eval store
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-smoke-home
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --setup
      - name: one real case before the complete model matrix
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-smoke-home
          PLUR1BUS_TOOLS_BIN: ${{ github.workspace }}/target/debug/plur1bus-tools
          PLUR1BUS_SANDBOX_LIMITS_BIN: ${{ github.workspace }}/target/debug/plur1bus-sandbox-limits
        # Captured output reaches the job log only after the canary scan succeeds.
        run: |
          mkdir -p artifacts/coding-smoke
          node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --smoke --out artifacts/coding-smoke/report.json > artifacts/coding-smoke/run.log 2>&1
      - name: scan report and evaluator log before publishing either
        id: coding-canary
        if: always()
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-smoke-home
        run: |
          report=()
          if [ -f artifacts/coding-smoke/report.json ]; then report=(--report artifacts/coding-smoke/report.json); fi
          node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --scan "${report[@]}" --log artifacts/coding-smoke/run.log
          cat artifacts/coding-smoke/run.log
      - name: remove the eval home
        if: always()
        run: rm -rf "${{ runner.temp }}/coding-smoke-home"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.coding-canary.outcome == 'success' && hashFiles('artifacts/coding-smoke/report.json') != '' }}
        with:
          name: coding-bench-smoke-${{ matrix.model }}
          path: artifacts/coding-smoke/report.json
          if-no-files-found: error

  coding-bench-live:
    needs: [coding-bench-plan, coding-bench-smoke]
    if: >-
      ${{ !cancelled() && needs.coding-bench-plan.result == 'success' &&
          (needs.coding-bench-smoke.result == 'success' ||
           (needs.coding-bench-smoke.result == 'skipped' &&
            !(github.event_name == 'workflow_dispatch' && inputs.coding-baseline-capture))) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.coding-bench-plan.outputs.matrix || '{"model":[0]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1", cache: false }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: frozen dependencies (engine credential scoped to this step)
        shell: bash
        env:
          GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"; else base="https://github.com/"; fi
          n=0
          for from in $([ -n "${GH_ENGINE_READ_TOKEN}" ] && echo "https://github.com/") "git@github.com:" "ssh://git@github.com/"; do
            export "GIT_CONFIG_KEY_$n=url.${base}.insteadOf" "GIT_CONFIG_VALUE_$n=$from"
            n=$((n + 1))
          done
          export GIT_CONFIG_COUNT=$n
          unset GH_ENGINE_READ_TOKEN base
          pnpm install --frozen-lockfile
      - name: install the existing verifier backend
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: generate types and build the native preflight binaries
        run: |
          pnpm gen
          cargo build --locked -p plur1bus-tools --bin plur1bus-tools
          cargo build --locked -p plur1bus --bin plur1bus-sandbox-limits
      - name: store provider keys and a runtime canary in the disposable eval store
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-bench-home
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --setup
      - name: real coding profile, 72 cases, paired against the owner's committed baseline
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-bench-home
          PLUR1BUS_TOOLS_BIN: ${{ github.workspace }}/target/debug/plur1bus-tools
          PLUR1BUS_SANDBOX_LIMITS_BIN: ${{ github.workspace }}/target/debug/plur1bus-sandbox-limits
          PLUR1BUS_CODING_BASELINE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.coding-baseline-capture }}
        # Captured output reaches the job log only after the canary scan succeeds.
        run: |
          mkdir -p artifacts/coding-bench
          if [ "$PLUR1BUS_CODING_BASELINE_CAPTURE" = true ]; then
            node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --live --out artifacts/coding-bench/report.json
          else
            node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --live --baseline docs/evals/2026-10-baseline-coding-bench.json --out artifacts/coding-bench/report.json
          fi > artifacts/coding-bench/run.log 2>&1
      - name: scan report and evaluator log before publishing either
        id: coding-canary
        if: always()
        env:
          PLUR1BUS_TURN_EVAL_MODELS: ${{ vars.PLUR1BUS_TURN_EVAL_MODELS }}
          PLUR1BUS_CODING_BENCH_MODEL_INDEX: ${{ matrix.model }}
          PLUR1BUS_CODING_BENCH_HOME: ${{ runner.temp }}/coding-bench-home
        run: |
          report=()
          if [ -f artifacts/coding-bench/report.json ]; then report=(--report artifacts/coding-bench/report.json); fi
          node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning scripts/eval/coding-bench.ts --scan "${report[@]}" --log artifacts/coding-bench/run.log
          cat artifacts/coding-bench/run.log
      - name: remove the eval home
        if: always()
        run: rm -rf "${{ runner.temp }}/coding-bench-home"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.coding-canary.outcome == 'success' && hashFiles('artifacts/coding-bench/report.json') != '' }}
        with:
          name: coding-bench-live-${{ matrix.model }}
          path: artifacts/coding-bench/report.json
          if-no-files-found: error

  m2-live-proof:
    # Independent, non-gating acceptance: never called from the pull-request workflow.
    # No configured endpoints => named skips; configured failures remain red in Nightly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_M2_NIGHTLY: "1"
      PLUR1BUS_MODELS_CACHE: ${{ github.workspace }}/.models-cache
      PLUR1BUS_M2_CHAT_URL: ${{ vars.PLUR1BUS_M2_CHAT_URL }}
      PLUR1BUS_M2_CHAT_MODEL: ${{ vars.PLUR1BUS_M2_CHAT_MODEL }}
      PLUR1BUS_M2_CHAT_KEY: ${{ secrets.PLUR1BUS_M2_CHAT_KEY }}
      PLUR1BUS_LIVE_OLLAMA_KEY: ${{ secrets.PLUR1BUS_LIVE_OLLAMA_KEY }}
      PLUR1BUS_LIVE_OLLAMA_URL: ${{ vars.PLUR1BUS_LIVE_OLLAMA_URL }}
      PLUR1BUS_LIVE_OLLAMA_MODEL: ${{ vars.PLUR1BUS_LIVE_OLLAMA_MODEL }}
      PLUR1BUS_LIVE_OLLAMA_DIMS: ${{ vars.PLUR1BUS_LIVE_OLLAMA_DIMS }}
      PLUR1BUS_LIVE_TEI_KEY: ${{ secrets.PLUR1BUS_LIVE_TEI_KEY }}
      PLUR1BUS_LIVE_TEI_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_TEI_RERANK_KEY }}
      PLUR1BUS_LIVE_TEI_URL: ${{ vars.PLUR1BUS_LIVE_TEI_URL }}
      PLUR1BUS_LIVE_TEI_MODEL: ${{ vars.PLUR1BUS_LIVE_TEI_MODEL }}
      PLUR1BUS_LIVE_TEI_DIMS: ${{ vars.PLUR1BUS_LIVE_TEI_DIMS }}
      PLUR1BUS_LIVE_TEI_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_TEI_RERANK_URL }}
      PLUR1BUS_LIVE_TEI_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_TEI_RERANK_MODEL }}
      PLUR1BUS_LIVE_VLLM_KEY: ${{ secrets.PLUR1BUS_LIVE_VLLM_KEY }}
      PLUR1BUS_LIVE_VLLM_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_VLLM_RERANK_KEY }}
      PLUR1BUS_LIVE_VLLM_URL: ${{ vars.PLUR1BUS_LIVE_VLLM_URL }}
      PLUR1BUS_LIVE_VLLM_MODEL: ${{ vars.PLUR1BUS_LIVE_VLLM_MODEL }}
      PLUR1BUS_LIVE_VLLM_DIMS: ${{ vars.PLUR1BUS_LIVE_VLLM_DIMS }}
      PLUR1BUS_LIVE_VLLM_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_VLLM_RERANK_URL }}
      PLUR1BUS_LIVE_VLLM_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_VLLM_RERANK_MODEL }}
      PLUR1BUS_LIVE_LLAMACPP_KEY: ${{ secrets.PLUR1BUS_LIVE_LLAMACPP_KEY }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_LLAMACPP_RERANK_KEY }}
      PLUR1BUS_LIVE_LLAMACPP_URL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_URL }}
      PLUR1BUS_LIVE_LLAMACPP_MODEL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_MODEL }}
      PLUR1BUS_LIVE_LLAMACPP_DIMS: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_DIMS }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_RERANK_URL }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_RERANK_MODEL }}
      PLUR1BUS_LIVE_OMLX_KEY: ${{ secrets.PLUR1BUS_LIVE_OMLX_KEY }}
      PLUR1BUS_LIVE_OMLX_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_OMLX_RERANK_KEY }}
      PLUR1BUS_LIVE_OMLX_URL: ${{ vars.PLUR1BUS_LIVE_OMLX_URL }}
      PLUR1BUS_LIVE_OMLX_MODEL: ${{ vars.PLUR1BUS_LIVE_OMLX_MODEL }}
      PLUR1BUS_LIVE_OMLX_DIMS: ${{ vars.PLUR1BUS_LIVE_OMLX_DIMS }}
      PLUR1BUS_LIVE_OMLX_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_OMLX_RERANK_URL }}
      PLUR1BUS_LIVE_OMLX_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_OMLX_RERANK_MODEL }}
      PLUR1BUS_LIVE_MTPLX_KEY: ${{ secrets.PLUR1BUS_LIVE_MTPLX_KEY }}
      PLUR1BUS_LIVE_MTPLX_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_MTPLX_RERANK_KEY }}
      PLUR1BUS_LIVE_MTPLX_URL: ${{ vars.PLUR1BUS_LIVE_MTPLX_URL }}
      PLUR1BUS_LIVE_MTPLX_MODEL: ${{ vars.PLUR1BUS_LIVE_MTPLX_MODEL }}
      PLUR1BUS_LIVE_MTPLX_DIMS: ${{ vars.PLUR1BUS_LIVE_MTPLX_DIMS }}
      PLUR1BUS_LIVE_MTPLX_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_MTPLX_RERANK_URL }}
      PLUR1BUS_LIVE_MTPLX_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_MTPLX_RERANK_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: m2-models
        with:
          path: ${{ github.workspace }}/.models-cache
          key: m2-models-${{ runner.os }}-e5-small-bge-v1
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build
      - name: M2 real Direct Chat and self-hosted adapter smoke
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning --test --test-concurrency=1 tests/nightly/m2-*.test.ts
      - name: save M2 model cache
        if: ${{ success() && steps.m2-models.outputs.cache-hit != 'true' && hashFiles('.models-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: m2-models-${{ runner.os }}-e5-small-bge-v1

  # M2 criterion 9: independent live prompt-cache evidence, never part of gating CI.
  b5-provider-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - name: six real provider turns (skip without owner credential/model)
        run: node --experimental-strip-types --conditions=source --test --test-timeout=300000 tests/nightly/b5-provider.test.ts
        env:
          PLUR1BUS_B5_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUR1BUS_B5_MODEL: ${{ vars.PLUR1BUS_B5_MODEL }}
      - name: publish redacted cache usage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: b5-provider-cache
          path: artifacts/b5-provider.json
          if-no-files-found: error
