name: nightly
# M1 acceptance 1 with real models, and the 1 000-turn kill soak (acceptance 2, flat embedder): the system test with the real e5-small embedder and the bge-reranker
# (PLUR1BUS_REAL_MODELS=1 asserts the reranker ran and did not fall back), plus the benchmark gates. The
# ~600 MB of models live in the core's <home>/models; the test links each temp home's models/ to
# PLUR1BUS_MODELS_CACHE, which is restored before and saved after the run (even a failed one).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  system-real-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_MODELS_CACHE: ${{ github.workspace }}/.models-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The lockfile records the engine's git repo as git@github.com:..., and runners have no SSH key:
      # fetch it over HTTPS instead, with the read token when the engine repo is private. Runs in every
      # job that installs; never echoes the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - name: restore model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: models-${{ runner.os }}-intfloat-multilingual-e5-small-woxpas-ai-bge-reranker-v2-m3-onnx-v1
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build && cargo build --release -p plur1bus
      - name: system test (real models)
        run: node --experimental-strip-types --test --test-timeout=300000 tests/system/two-session-recall.test.ts
        timeout-minutes: 30
        # H3-R26: shared CI runners are not reference hardware. The CI recall budget keeps a slow runner from
        # aborting the recall (degraded must still be null); the 400/600 ms targets are reported as diagnostics and
        # `::warning::` lines here, and asserted only on reference hardware (AGENTS.md, "Real-model acceptance").
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_REAL_MODELS: "1", PLUR1BUS_CI_RECALL_HARD_MS: "2000" }
      # Criterion 2 at full length (S16, ruling H3-R19): 1 000 turns over 10 agents, flat embedder (the soak is about
      # durability under kills, so it does not need the models).
      - name: kill soak (1 000 turns)
        # Runs even when the real-model system test failed: the two acceptances are independent.
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --test --test-timeout=1800000 tests/system/kill-soak.test.ts
        timeout-minutes: 60
        # Recall budget 3 s here (PR CI keeps 1 s): the 1 000-turn run grows each agent's table, and recall slows with
        # every LanceDB fragment (known engine follow-up); the soak prints per-third p95/max so the growth stays visible.
        env: { PLUR1BUS_BIN: target/release/plur1bus, PLUR1BUS_SOAK_TURNS: "1000", PLUR1BUS_SOAK_RECALL_BUDGET_MS: "3000" }
      - run: pnpm bench
        timeout-minutes: 10
      - name: save model cache
        if: ${{ always() && steps.models.outputs.cache-hit != 'true' && hashFiles('.models-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: ${{ steps.models.outputs.cache-primary-key }}
  # M2 acceptance 13 (D95): the SearXNG provider against a live instance. Not gating and skipped unless the repository
  # variable PLUR1BUS_SEARXNG_LIVE_URL is set to an instance the sidecar rule admits (private, tailnet or loopback
  # address; a hosted runner can reach it only through a self-hosted runner or a service container). A red run opens the
  # usual nightly issue and blocks nothing.
  web-search-searxng-live:
    if: ${{ vars.PLUR1BUS_SEARXNG_LIVE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_SEARXNG_LIVE_URL: ${{ vars.PLUR1BUS_SEARXNG_LIVE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build
      - name: live SearXNG search
        working-directory: packages/core
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning --test --test-timeout=120000 test/live/web-search-searxng.test.ts
  # Spec 2026-09-27 §8.4/§12, acceptance 8: ten minutes of mutants of valid .p1x packages through the inspect pipeline
  # (no panic, no mutant accepted as first-party). The seed is printed; replay a failure with PLUR1BUS_FUZZ_SEED.
  ext-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (toolchain fixed by with)
        with: { toolchain: "1.95" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: fuzz the inspect pipeline (600 s)
        run: PLUR1BUS_FUZZ_SECONDS=600 cargo test -p plur1bus-ext --features testkit --test fuzz -- --ignored --nocapture

  m2-live-proof:
    # Independent, non-gating acceptance: never called from the pull-request workflow.
    # No configured endpoints => named skips; configured failures remain red in Nightly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      PLUR1BUS_M2_NIGHTLY: "1"
      PLUR1BUS_MODELS_CACHE: ${{ github.workspace }}/.models-cache
      PLUR1BUS_M2_CHAT_URL: ${{ vars.PLUR1BUS_M2_CHAT_URL }}
      PLUR1BUS_M2_CHAT_MODEL: ${{ vars.PLUR1BUS_M2_CHAT_MODEL }}
      PLUR1BUS_M2_CHAT_KEY: ${{ secrets.PLUR1BUS_M2_CHAT_KEY }}
      PLUR1BUS_LIVE_OLLAMA_KEY: ${{ secrets.PLUR1BUS_LIVE_OLLAMA_KEY }}
      PLUR1BUS_LIVE_OLLAMA_URL: ${{ vars.PLUR1BUS_LIVE_OLLAMA_URL }}
      PLUR1BUS_LIVE_OLLAMA_MODEL: ${{ vars.PLUR1BUS_LIVE_OLLAMA_MODEL }}
      PLUR1BUS_LIVE_OLLAMA_DIMS: ${{ vars.PLUR1BUS_LIVE_OLLAMA_DIMS }}
      PLUR1BUS_LIVE_TEI_KEY: ${{ secrets.PLUR1BUS_LIVE_TEI_KEY }}
      PLUR1BUS_LIVE_TEI_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_TEI_RERANK_KEY }}
      PLUR1BUS_LIVE_TEI_URL: ${{ vars.PLUR1BUS_LIVE_TEI_URL }}
      PLUR1BUS_LIVE_TEI_MODEL: ${{ vars.PLUR1BUS_LIVE_TEI_MODEL }}
      PLUR1BUS_LIVE_TEI_DIMS: ${{ vars.PLUR1BUS_LIVE_TEI_DIMS }}
      PLUR1BUS_LIVE_TEI_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_TEI_RERANK_URL }}
      PLUR1BUS_LIVE_TEI_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_TEI_RERANK_MODEL }}
      PLUR1BUS_LIVE_VLLM_KEY: ${{ secrets.PLUR1BUS_LIVE_VLLM_KEY }}
      PLUR1BUS_LIVE_VLLM_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_VLLM_RERANK_KEY }}
      PLUR1BUS_LIVE_VLLM_URL: ${{ vars.PLUR1BUS_LIVE_VLLM_URL }}
      PLUR1BUS_LIVE_VLLM_MODEL: ${{ vars.PLUR1BUS_LIVE_VLLM_MODEL }}
      PLUR1BUS_LIVE_VLLM_DIMS: ${{ vars.PLUR1BUS_LIVE_VLLM_DIMS }}
      PLUR1BUS_LIVE_VLLM_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_VLLM_RERANK_URL }}
      PLUR1BUS_LIVE_VLLM_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_VLLM_RERANK_MODEL }}
      PLUR1BUS_LIVE_LLAMACPP_KEY: ${{ secrets.PLUR1BUS_LIVE_LLAMACPP_KEY }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_LLAMACPP_RERANK_KEY }}
      PLUR1BUS_LIVE_LLAMACPP_URL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_URL }}
      PLUR1BUS_LIVE_LLAMACPP_MODEL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_MODEL }}
      PLUR1BUS_LIVE_LLAMACPP_DIMS: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_DIMS }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_RERANK_URL }}
      PLUR1BUS_LIVE_LLAMACPP_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_LLAMACPP_RERANK_MODEL }}
      PLUR1BUS_LIVE_OMLX_KEY: ${{ secrets.PLUR1BUS_LIVE_OMLX_KEY }}
      PLUR1BUS_LIVE_OMLX_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_OMLX_RERANK_KEY }}
      PLUR1BUS_LIVE_OMLX_URL: ${{ vars.PLUR1BUS_LIVE_OMLX_URL }}
      PLUR1BUS_LIVE_OMLX_MODEL: ${{ vars.PLUR1BUS_LIVE_OMLX_MODEL }}
      PLUR1BUS_LIVE_OMLX_DIMS: ${{ vars.PLUR1BUS_LIVE_OMLX_DIMS }}
      PLUR1BUS_LIVE_OMLX_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_OMLX_RERANK_URL }}
      PLUR1BUS_LIVE_OMLX_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_OMLX_RERANK_MODEL }}
      PLUR1BUS_LIVE_MTPLX_KEY: ${{ secrets.PLUR1BUS_LIVE_MTPLX_KEY }}
      PLUR1BUS_LIVE_MTPLX_RERANK_KEY: ${{ secrets.PLUR1BUS_LIVE_MTPLX_RERANK_KEY }}
      PLUR1BUS_LIVE_MTPLX_URL: ${{ vars.PLUR1BUS_LIVE_MTPLX_URL }}
      PLUR1BUS_LIVE_MTPLX_MODEL: ${{ vars.PLUR1BUS_LIVE_MTPLX_MODEL }}
      PLUR1BUS_LIVE_MTPLX_DIMS: ${{ vars.PLUR1BUS_LIVE_MTPLX_DIMS }}
      PLUR1BUS_LIVE_MTPLX_RERANK_URL: ${{ vars.PLUR1BUS_LIVE_MTPLX_RERANK_URL }}
      PLUR1BUS_LIVE_MTPLX_RERANK_MODEL: ${{ vars.PLUR1BUS_LIVE_MTPLX_RERANK_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.21.0, cache: pnpm }
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: m2-models
        with:
          path: ${{ github.workspace }}/.models-cache
          key: m2-models-${{ runner.os }}-e5-small-bge-v1
      - run: pnpm install --frozen-lockfile && pnpm gen && pnpm build
      - name: M2 real Direct Chat and self-hosted adapter smoke
        run: node --experimental-strip-types --conditions=source --no-warnings=ExperimentalWarning --test --test-concurrency=1 tests/nightly/m2-*.test.ts
      - name: save M2 model cache
        if: ${{ always() && steps.m2-models.outputs.cache-hit != 'true' && hashFiles('.models-cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.models-cache
          key: m2-models-${{ runner.os }}-e5-small-bge-v1

  # M2 criterion 9: independent live prompt-cache evidence, never part of gating CI.
  b5-provider-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.21.0 }
      - name: six real provider turns (skip without owner credential/model)
        run: node --experimental-strip-types --conditions=source --test --test-timeout=300000 tests/nightly/b5-provider.test.ts
        env:
          PLUR1BUS_B5_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUR1BUS_B5_MODEL: ${{ vars.PLUR1BUS_B5_MODEL }}
      - name: publish redacted cache usage
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: b5-provider-cache
          path: artifacts/b5-provider.json
          if-no-files-found: error
