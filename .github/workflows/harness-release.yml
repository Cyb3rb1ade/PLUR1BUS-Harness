name: harness-release
# The harness's native release artefacts (2a-H3b-b Task 10, HB7, HB18): per-target core payloads, per-target
# `plur1bus` binaries (the payload hash, the release base URL and the channels' public keys baked in), the signed and
# notarised macOS binary, and `release-native.json`, the `native` object of D78's release.json. D78's `release.yml`
# calls this workflow, merges release-native.json into release.json, signs it and publishes everything; this workflow
# publishes nothing itself. It never runs on a push: only when called or dispatched. The first packaged run follows
# docs/manual-release.md.
#
# Owner setup (names only; no value lives in this repository):
#   GitHub Environment `macos-signing` (required reviewer: the owner) with the secrets MACOS_CERT_P12 (base64 of the
#   Developer ID Application .p12), MACOS_CERT_PASSWORD, APPLE_API_KEY_P8 (base64 of the App Store Connect API .p8),
#   APPLE_API_KEY_ID, APPLE_API_ISSUER, and the variable MACOS_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)").
#   Repository variables (public values): PLUR1BUS_RELEASE_PUBKEY_STABLE, PLUR1BUS_RELEASE_PUBKEY_BETA (minisign public
#   keys, the base64 line) and optionally PLUR1BUS_RELEASE_BASE_URL. Repository secret GH_ENGINE_READ_TOKEN as in ci.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Release version; must equal the Cargo workspace version.
        type: string
        required: true
      channel:
        description: Release channel (stable or beta).
        type: string
        required: false
        default: stable
      dry-run:
        description: Build and check everything; skip signing and the release artefact upload.
        type: boolean
        required: false
        default: false
    # The signing secrets are read from the `macos-signing` environment (environment secrets take precedence over
    # passed ones); they are declared here only so a caller may pass nothing.
    secrets:
      GH_ENGINE_READ_TOKEN:
        required: false
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
    outputs:
      artifact:
        description: Name of the workflow artefact holding the binaries, payloads and release-native.json.
        value: ${{ jobs.native.outputs.artifact }}
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check everything; skip signing and the release artefact upload.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: harness-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      base-url: ${{ steps.meta.outputs.base-url }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          BASE_URL_VAR: ${{ vars.PLUR1BUS_RELEASE_BASE_URL }}
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ -n "$cargo_version" ] || { echo "::error::no workspace version in Cargo.toml"; exit 1; }
          version="${INPUT_VERSION:-$cargo_version}"
          version="${version#v}"
          # setup downloads core-<binary version>-<target>.tar.gz: the release version is the binary's version.
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::release version $version is not the Cargo workspace version $cargo_version"
            exit 1
          fi
          channel="${INPUT_CHANNEL:-stable}"
          case "$channel" in stable | beta) ;; *) echo "::error::unknown channel $channel"; exit 1 ;; esac
          base="${BASE_URL_VAR:-https://github.com/Cyb3rb1ade/PLUR1BUS-Harness/releases/download/v$version}"
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "base-url=${base%/}"
          } >> "$GITHUB_OUTPUT"
          echo "release $version ($channel), base $base, dry-run ${{ inputs.dry-run }}"

  payload:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win-x64, runner: windows-2025 }
          - { target: win-arm64, runner: windows-11-arm }
    # The payload's native addons (LanceDB, onnxruntime, sharp) are installed for the host: each target builds on its
    # own runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GH_ENGINE_READ_TOKEN: ${{ secrets.GH_ENGINE_READ_TOKEN }}
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      # As in ci.yml: fetch the engine over HTTPS, with the read token when the engine repo is private. Never echoes
      # the rewritten URL.
      - name: engine git access over https
        shell: bash
        run: |
          if [ -n "${GH_ENGINE_READ_TOKEN}" ]; then
            base="https://x-access-token:${GH_ENGINE_READ_TOKEN}@github.com/"
            git config --global --add "url.${base}.insteadOf" "https://github.com/"
          else
            base="https://github.com/"
          fi
          git config --global --add "url.${base}.insteadOf" "git@github.com:"
          git config --global --add "url.${base}.insteadOf" "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm build
      - name: assemble the core payload
        shell: bash
        run: node scripts/release/assemble-payload.mjs --target "${{ matrix.target }}" --out "dist/core-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.target }}
          path: dist/core-${{ needs.meta.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 3

  binary:
    needs: [meta, payload]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, zig: true }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, zig: true }
          - { target: darwin-arm64, runner: macos-15, triple: aarch64-apple-darwin, zig: false }
          - { target: win-x64, runner: windows-2025, triple: x86_64-pc-windows-msvc, zig: false }
          - { target: win-arm64, runner: windows-11-arm, triple: aarch64-pc-windows-msvc, zig: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.95", targets: "${{ matrix.triple }}" }
      # HB7: glibc 2.28 floor for the Linux binaries.
      - if: matrix.zig
        run: python3 -m pip install --user cargo-zigbuild==0.23.4 ziglang==0.15.2
      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.target }}
          path: payload
      - name: build
        shell: bash
        env:
          PUBKEY_STABLE: ${{ vars.PLUR1BUS_RELEASE_PUBKEY_STABLE }}
          PUBKEY_BETA: ${{ vars.PLUR1BUS_RELEASE_PUBKEY_BETA }}
          PLUR1BUS_RELEASE_BASE_URL: ${{ needs.meta.outputs.base-url }}
          DRY_RUN: ${{ inputs.dry-run }}
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
          ZIG: ${{ matrix.zig }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          sums="payload/core-$VERSION-$TARGET.tar.gz.sha256"
          PLUR1BUS_CORE_SHA256="$(awk '{print $1}' "$sums")"
          case "$PLUR1BUS_CORE_SHA256" in
            [0-9a-f]*) [ "${#PLUR1BUS_CORE_SHA256}" = 64 ] || { echo "::error::bad payload hash in $sums"; exit 1; } ;;
            *) echo "::error::bad payload hash in $sums"; exit 1 ;;
          esac
          export PLUR1BUS_CORE_SHA256
          # The channels' public keys (not secrets). An empty variable is left unset: option_env! would bake "".
          for ch in STABLE BETA; do
            eval "key=\${PUBKEY_$ch}"
            if [ -n "$key" ]; then
              export "PLUR1BUS_RELEASE_PUBKEY_$ch=$key"
            elif [ "$DRY_RUN" = true ]; then
              echo "::warning::PLUR1BUS_RELEASE_PUBKEY_$ch is not set: this dry-run binary cannot verify the $ch feed"
            else
              echo "::error::repository variable PLUR1BUS_RELEASE_PUBKEY_$ch is not set"
              exit 1
            fi
          done
          if [ "$ZIG" = true ]; then
            user_base="$(python3 -m site --user-base)"
            export PATH="$user_base/bin:$PATH"
            cargo zigbuild --locked --release -p plur1bus --target "$TRIPLE.2.28"
          else
            cargo build --locked --release -p plur1bus --target "$TRIPLE"
          fi
          ext=""
          case "$TARGET" in win-*) ext=".exe" ;; esac
          mkdir -p out
          cp "target/$TRIPLE/release/plur1bus$ext" "out/plur1bus-$TARGET$ext"
          # Each target builds on its own architecture, so the binary runs here.
          "out/plur1bus-$TARGET$ext" --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  # HB18: Developer ID signature with the hardened runtime and a secure timestamp, then notarisation. A bare Mach-O
  # cannot be stapled; Gatekeeper fetches the ticket online (ADR-012). The job waits for the owner's approval of the
  # `macos-signing` environment, whose secrets only this job sees.
  sign-macos:
    needs: [meta, binary]
    if: ${{ !inputs.dry-run }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-arm64
          path: out
      - name: import the signing certificate into a temporary keychain
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set in the macos-signing environment"; exit 1; }
          done
          keychain="$RUNNER_TEMP/plur1bus-signing.keychain-db"
          keychain_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_pw"
          umask 077
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # Put the temporary keychain first in the user search list, keeping the existing ones.
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' -e '/^$/d')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: codesign
        shell: bash
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          [ -n "$IDENTITY" ] || { echo "::error::variable MACOS_SIGNING_IDENTITY is not set in the macos-signing environment"; exit 1; }
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" out/plur1bus-darwin-arm64
          codesign --verify --strict --verbose=2 out/plur1bus-darwin-arm64
          codesign --display --verbose=2 out/plur1bus-darwin-arm64
      - name: notarise
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set in the macos-signing environment"; exit 1; }
          done
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --keepParent out/plur1bus-darwin-arm64 "$RUNNER_TEMP/plur1bus.zip"
          xcrun notarytool submit "$RUNNER_TEMP/plur1bus.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 45m
          rm -f "$key" "$RUNNER_TEMP/plur1bus.zip"
          out/plur1bus-darwin-arm64 --version
      - name: remove the keychain and key files
        if: always()
        shell: bash
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/plur1bus.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-darwin-arm64
          path: out/plur1bus-darwin-arm64
          if-no-files-found: error
          retention-days: 3

  native:
    needs: [meta, payload, binary, sign-macos]
    # Runs after a skipped sign-macos only in a dry run.
    if: >-
      ${{ always() && needs.payload.result == 'success' && needs.binary.result == 'success'
      && (needs.sign-macos.result == 'success' || (inputs.dry-run && needs.sign-macos.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      # release-native.mjs validates with Ajv from @plur1bus/rpc-schema; nothing else is installed.
      - run: pnpm install --frozen-lockfile --filter @plur1bus/rpc-schema
      - uses: actions/download-artifact@v4
        with:
          pattern: "{payload,binary}-*"
          path: artifacts
          merge-multiple: true
      - name: use the signed macOS binary
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@v4
        with:
          name: signed-darwin-arm64
          path: artifacts
      - name: release-native.json
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BASE_URL: ${{ needs.meta.outputs.base-url }}
        run: |
          node scripts/release/release-native.mjs --artifacts artifacts --version "$VERSION" --base-url "$BASE_URL" --out artifacts/release-native.json
          (cd artifacts && sha256sum plur1bus-* core-*.tar.gz > SHA256SUMS)
          {
            echo '### release-native.json'
            echo '```json'
            cat artifacts/release-native.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: name
        run: echo "artifact=harness-release-${{ needs.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            artifacts/plur1bus-*
            artifacts/core-*.tar.gz
            artifacts/core-*.tar.gz.sha256
            artifacts/release-native.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
