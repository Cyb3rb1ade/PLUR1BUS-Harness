[package]
name = "plur1bus-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "plur1bus_desktop"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
plur1bus-desktop-contract = { path = "../desktop-contract", version = "=0.1.0" }
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-notification = "=2.5.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.23.0"
sys-locale = "=0.3.2"

keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
zeroize = "=1.9.0"
uuid = { version = "=1.26.1", features = ["v7", "serde"] }
url = "=2.5.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
regex = "=1.13.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "cookies"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.2"
tokio = { version = "=1.48.0", features = ["process", "time", "io-util"] }
chrono = "=0.4.42"
rand = "=0.9.2"
x509-parser = "=0.18.1"

axum = { version = "=0.8.6", features = ["ws"] }
futures-util = "=0.3.31"
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
plur1bus-mock-harness = { path = "../mock-harness", version = "=0.1.0" }
jsonschema = { version = "=0.26.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
