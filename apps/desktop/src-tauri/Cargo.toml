[package]
name = "plur1bus-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "plur1bus_desktop"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
plur1bus-desktop-contract = { path = "../desktop-contract", version = "=0.1.0" }
tauri = { version = "=2.12.0", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.23.0"

[dev-dependencies]
