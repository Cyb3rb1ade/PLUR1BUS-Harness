[package]
name = "plur1bus-ssh-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

# Research executable only; no desktop product crate depends on this package.
# RSA is intentionally absent: RUSTSEC-2023-0071 has no fixed release.
[features]
default = ["ssh"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:rand", "dep:tokio", "dep:futures-util", "dep:sha2", "dep:tempfile", "dep:zeroize"]

[dependencies]
russh = { version = "=0.64.1", optional = true, default-features = false, features = ["ring"] }
russh-sftp = { version = "=2.1.1", optional = true }
rand = { version = "=0.10.3", optional = true }
tokio = { version = "=1.48.0", optional = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
futures-util = { version = "=0.3.31", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.23.0", optional = true }
zeroize = { version = "=1.9.0", optional = true }
