[package]
name = "plur1bus-desktop-test-bins"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "fake-plur1bus"
path = "src/fake_plur1bus.rs"

[[bin]]
name = "fake-container"
path = "src/fake_container.rs"

[[bin]]
name = "fake-host"
path = "src/fake_host.rs"

[dependencies]
sha2 = "=0.10.9"
plur1bus-desktop-contract = { path = "../desktop-contract", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
async-trait = "=0.1.92"
plur1bus-desktop = { path = "../src-tauri", version = "=0.1.0" }
tempfile = "=3.23.0"
plur1bus-mock-harness = { path = "../mock-harness" }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
syn = { version = "=2.0.119", features = ["full"] }
