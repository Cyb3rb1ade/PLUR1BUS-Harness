[package]
name = "plur1bus-mock-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "plur1bus_mock_harness"

[[bin]]
name = "plur1bus-mock-harness"
path = "src/main.rs"

[dependencies]
plur1bus-desktop-contract = { path = "../desktop-contract", version = "=0.1.0" }
axum = { version = "=0.8.6", features = ["ws"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
futures-util = "=0.3.31"
rand = "=0.9.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["full"] }
tempfile = "=3.23.0"

rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = "=0.14.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
zeroize = "=1.9.0"

[dev-dependencies]
reqwest = { version = "=0.12.24", features = ["json"] }
tempfile = "=3.23.0"
tokio-tungstenite = "=0.28.0"
tower = { version = "=0.5.3", features = ["util"] }
