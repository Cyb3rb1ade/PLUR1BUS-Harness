[package]
name = "plur1bus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PLUR1BUS memory engine in Rust (rust-engine plan §2): store, embeddings, recall, capture and jobs behind one supervised process. RE-00 skeleton: no engine behaviour yet."

[lib]
name = "plur1bus_engine"
path = "src/lib.rs"

[[bin]]
name = "plur1bus-engine"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# Pinned to the version the Node engine's committed lockfile resolves for @lancedb/lancedb (RE-D3): the Node SDK is a
# binding of this crate, so the same version reads and writes the same on-disk Lance format.
lancedb = "=0.26.2"
# Not used in code: `lance` (the version lancedb 0.26.2 pins) is named only to turn on its `protoc` feature, which builds
# the protobuf compiler that lance-encoding, lance-file, lance-index and lance-table need at build time from source
# (`protobuf-src`, needs cmake and a C++ compiler) instead of requiring `protoc` on every developer machine and CI runner.
lance = { version = "=2.0.0", default-features = false, features = ["protoc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
jsonschema = { version = "0.26", default-features = false }
# One HTTP client policy in the workspace: the same version and features as crates/plur1bus (rustls, no native-tls).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true
