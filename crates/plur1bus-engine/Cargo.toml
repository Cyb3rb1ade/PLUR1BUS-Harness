[package]
name = "plur1bus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PLUR1BUS memory engine in Rust: authenticated process server, compatible stores and embedding providers."

[lib]
name = "plur1bus_engine"
path = "src/lib.rs"

[[bin]]
name = "plur1bus-engine"
path = "src/main.rs"

[[test]]
name = "embedding_parity"
path = "tests/embedding_parity.rs"
required-features = ["real-models"]

[[test]]
name = "media_model_parity"
path = "tests/media_model_parity.rs"
required-features = ["real-models"]

[[test]]
name = "media_audio_reference"
path = "tests/media_audio_reference.rs"
required-features = ["real-models"]

[[test]]
name = "media_image_reference"
path = "tests/media_image_reference.rs"
required-features = ["real-models"]

[lints]
workspace = true

[features]
testkit = []
real-models = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# Reuse the supervisor's already-locked OS entropy source for per-start RPC tokens.
getrandom = "=0.3.4"
# Pinned to the version the Node engine's committed lockfile resolves for @lancedb/lancedb (RE-D3): the Node SDK is a
# binding of this crate, so the same version reads and writes the same on-disk Lance format.
lancedb = "=0.26.2"
# Not used in code: `lance` (the version lancedb 0.26.2 pins) is named only to turn on its `protoc` feature, which builds
# the protobuf compiler that lance-encoding, lance-file, lance-index and lance-table need at build time from source
# (`protobuf-src`, needs cmake and a C++ compiler) instead of requiring `protoc` on every developer machine and CI runner.
lance = { version = "=2.0.0", default-features = false, features = ["protoc"] }
rusqlite = { version = "0.41", features = ["bundled"] }
jsonschema = { version = "0.26", default-features = false }
regex = "1"
fancy-regex = "0.17"
icu_normalizer = "2.3"
icu_collator = "2.3"
icu_locale_core = "2.3"
url = "2"
chrono-tz.workspace = true
regress.workspace = true
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
# RE-03/T0: rc.14 (2026-10-12) is the newest release outside the two-week window.
# Dynamic loading only: no build-time runtime downloads, static linkage, or second HTTP/TLS stack.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic"] }
# ureq-proto traces serialized HTTP bytes; strip TRACE even if a host enables it at runtime.
# Sensitive header flags still protect the remaining Debug request diagnostics.
log = { version = "0.4", features = ["max_level_debug"] }
sha2 = "0.10"
# One HTTP client policy in the workspace: the same version and features as crates/plur1bus (rustls, no native-tls).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Reuse the locked socket API for cancellation of ureq connections; this adds no HTTP/TLS stack.
socket2 = "=0.6.5"
# MM-1/E13: bounded decode only; Pillow-compatible resize stays in-tree.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# Keep these direct dependencies on the exact lines already resolved by lancedb 0.26.2.
arrow-array = "=57.3.1"
arrow-schema = "=57.3.1"
arrow-json = "=57.3.1"
futures = "=0.3.34"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
plur1bus-rpc = { path = "../plur1bus-rpc" }
plur1bus-config = { path = "../plur1bus-config" }
plur1bus-log-schema = { path = "../plur1bus-log-schema" }
tokio = { version = "=1.53.3", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
typify.workspace = true
schemars.workspace = true
serde_json.workspace = true
syn.workspace = true
prettyplease.workspace = true
