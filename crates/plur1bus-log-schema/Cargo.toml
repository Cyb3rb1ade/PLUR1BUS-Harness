[package]
name = "plur1bus-log-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D111 log record schema, event catalogue, level map and redaction data, and the shared redactor: the Rust mirror of packages/log-schema"

[dependencies]
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.26", default-features = false }
regex = "1"
# The deny-listed path hash of the redactor (`<deny:class>/…#hash`): the version the CLI and the core already lock.
sha2 = "0.10"
