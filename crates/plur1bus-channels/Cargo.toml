[package]
name = "plur1bus-channels"
description = "Wire protocols for channel adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exercise each available adapter in the native workspace suite. Consumers can select one feature.
default = ["telegram", "discord", "slack", "signal", "email", "buzz"]
telegram = ["http", "dep:indexmap", "dep:regex", "dep:percent-encoding", "dep:sha2", "dep:subtle"]
discord = ["http", "websocket", "dep:regex"]
slack = ["http", "websocket", "dep:indexmap"]
signal = ["dep:serde", "dep:serde_json", "dep:regex"]
email = ["dep:base64", "dep:chrono", "dep:encoding_rs", "dep:regex", "dep:serde"]
buzz = ["websocket", "dep:nostr", "dep:secp256k1", "dep:serde", "dep:zeroize"]
http = ["dep:serde", "dep:serde_json", "dep:ureq", "dep:url"]
websocket = ["dep:serde_json", "dep:tungstenite", "dep:url"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
encoding_rs = { version = "0.8", optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44"], optional = true }
percent-encoding = { version = "2.3", optional = true }
regex = { version = "1", optional = true }
secp256k1 = { version = "=0.30.0", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["raw_value"], optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2.6", optional = true }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
url = { version = "2.5", optional = true }
zeroize = { version = "1.9", optional = true }

[dev-dependencies]
base64 = "0.22"
plur1bus-wire-fixtures = { path = "../plur1bus-wire-fixtures" }
serde_json.workspace = true

[lints]
workspace = true
