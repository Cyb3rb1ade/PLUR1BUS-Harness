[package]
name = "plur1bus-attest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native helper for OS-backed attestation (issue #192): asks the operating system for one fresh confirmation (Touch ID, Windows Hello / UAC consent, polkit) for one approval. JSON over stdin/stdout; the core runs it as a child process."

[lib]
name = "plur1bus_attest"
path = "src/lib.rs"

[[bin]]
name = "plur1bus-attest"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
windows-future = "0.3"
