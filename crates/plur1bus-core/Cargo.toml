[package]
name = "plur1bus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PLUR1BUS core in Rust (Phase 4, ADR-019): the front door on run/core.sock (P4-10), relaying to the legacy TypeScript core behind it."

[lints]
workspace = true

[lib]
name = "plur1bus_core"
path = "src/lib.rs"

[[bin]]
name = "plur1bus-core"
path = "src/main.rs"

[dependencies]
# `server`: the generated `CoreMethods` trait, its dispatcher and the pruned validators (P4-03).
plur1bus-rpc = { path = "../plur1bus-rpc", features = ["server"] }
clap.workspace = true
sha2 = "0.10"
# P4-03 review F1: the front door parses frames itself, so it needs JSON.parse's exact float rounding on its own
# dependency edge, not only through feature unification with plur1bus-canon.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
# P4-10 security review M1/L3: the tolerant peek reads a frame's routing members with serde's `IgnoredAny` and `RawValue`
# (`raw_value` is a feature of the serde_json already locked; serde is the workspace's), so a frame JSON.parse accepts but
# serde_json would refuse (a lone surrogate escape, nesting deeper than 128) is still routed and relayed as written.
serde.workspace = true
# The validators `plur1bus_rpc::server::compile` returns (the version and features plur1bus-rpc's `server` feature locks).
jsonschema = { version = "0.26", default-features = false }
# P4-10: the core lock (state/core.lock, the TypeScript core's SQLite byte range) and create_private for run files.
plur1bus-audit = { path = "../plur1bus-audit" }
# P4-11: the D111 record schema, the level map and the one redactor the CLI shares (rules 1 to 6 as options).
plur1bus-log-schema = { path = "../plur1bus-log-schema" }
# P4-11: the configuration modules (config/) sit on the schema, the loader and the restart classes of plur1bus-config.
plur1bus-config = { path = "../plur1bus-config" }
# P4-12: identity.sqlite, admin.sqlite, desktop-attach.db and memory-sensitivity.sqlite through the owner mode of
# plur1bus-store (first party; its rusqlite, bundled, is the one the engine already locks).
plur1bus-store = { path = "../plur1bus-store" }
# P4-10: run/core.token and friends (32 random bytes), kept in zeroized memory; the instance id. Versions the CLI and the
# tools service already lock.
getrandom = "0.3"
whoami = "1.5"
zeroize = "=1.9.0"
uuid = { version = "1", features = ["v4"] }
# P4-20: the encrypted-file secret backend writes what the TypeScript backend writes (AES-256-GCM per entry, base64
# members). Both are versions the workspace already locks: ring through plur1bus-ext and rustls, base64 through the engine.
ring = "0.17"
base64 = "=0.22.1"
# P4-K K1: the IANA time-zone database behind `budget::zones` (a budget period is a local day, week or month). Both are
# crates the engine already locks; no new package in the lock file.
chrono-tz.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
# P4-K K2: the host parser of the URL Standard behind `egress::Idna` (what Node's `domainToASCII` runs) and Unicode NFC
# behind `policy::paths::Nfc` (`String.prototype.normalize`). Both are locked already: `url` by the engine, and
# `icu_normalizer` through `url`'s IDNA. No new package in the lock file.
url = "2"
icu_normalizer = "2.3"
# P4-K K9a: the provider cache-profile table and the model-id normaliser behind `prompt::model_table` (the rows the
# TypeScript builder reads from `packages/providers/schema/cache-profiles.json`). A workspace crate, already in the lock
# file; it brings no new package.
plur1bus-tokens = { path = "../plur1bus-tokens" }

# The operating system's keyring behind `secrets::os_keyring` (P4-20 PR 2b). The same crates `@napi-rs/keyring` 2.1.0
# wraps on the TypeScript side, so both implementations read and write the same items. Pinned exactly: a store that
# changes how it names an item would hide every secret already stored.
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# `keychain` only: the login keychain. `protected` (the data-protection keychain) holds other items.
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Without `search` (its only default feature): entries are made, never searched for.
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service over zbus (no libdbus). There is no store for the kernel keyring here, on purpose: a keyring that
# is not there is reported as such, never replaced by one that forgets at the next boot (P4D-34).
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM/SIGINT take the stop path (the supervisor's own choice of crate and features).
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
# O_NOFOLLOW and O_NONBLOCK for the one open of a credential file in run/ (`run_files::read_token`, P4-20 flip B2,
# review U2). The crate plur1bus-rpc and plur1bus-audit already depend on; no new package in the lock file.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Mode W fake server (tests/support/): the engine's tokio, loopback sockets only.
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "io-util"] }
# The WebSocket handshake's Sec-WebSocket-Accept (RFC 6455: base64 of SHA-1, base64 being a dependency above); the
# version is already locked.
sha1 = "=0.11.0"

# P4-10: the front door against a fake legacy core in this test binary (its `main` dispatches on the first argument).
[[test]]
name = "front_door"
harness = false

# P4-20: the secret helper as a process; this test binary is also the process that never answers (`hang`).
[[test]]
name = "secrets_helper"
harness = false

# The adapters of secrets::os_keyring against a real keyring. Does nothing unless PLUR1BUS_KEYRING_PROBE is set
# (scripts/ci/keyring-probe.mjs, in CI only).
[[test]]
name = "keyring_probe"
harness = false
