[package]
name = "plur1bus-ext"
version.workspace = true
edition.workspace = true
license.workspace = true

# Extensions from file (spec 2026-09-27 §5, §8): audits, verifies and packs `.p1x` packages. It never extracts
# (X1-R3) and the supervisor never links it for package bytes (X1-R2; scripts/lint-hygiene.mjs).
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
flate2 = "1"
# Writer for `ext pack` only; the audit uses its own central-directory parser.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
minisign-verify = "0.2"
jsonschema = { version = "0.26", default-features = false }
semver = "1"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# Test and fixture signing only (feature `testkit`): keys are generated in memory per run, none is committed.
minisign = { version = "0.10", optional = true }

[features]
testkit = ["dep:minisign"]

[[example]]
name = "make-fixtures"
required-features = ["testkit"]

[dev-dependencies]
tempfile.workspace = true
# Itself with `testkit`, so the plain `cargo test --workspace` of PR CI builds and runs the `verify` and `fuzz` tests
# (`fuzz_smoke` in every `cargo test`). Dev-dependency features never reach a normal build (resolver 2).
plur1bus-ext = { path = ".", features = ["testkit"] }

[[test]]
name = "verify"
required-features = ["testkit"]

[[test]]
name = "fuzz"
required-features = ["testkit"]
