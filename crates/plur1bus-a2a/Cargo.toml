[package]
name = "plur1bus-a2a"
description = "A2A wire protocol projections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "=1.1.5"
base64 = "=0.22.1"
plur1bus-canon = { path = "../plur1bus-canon" }
plur1bus-providers = { path = "../plur1bus-providers" }
ring = "=0.17.14"
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
url = "=2.5.9"

[dev-dependencies]
log = "=0.4.34"
plur1bus-wire-fixtures = { path = "../plur1bus-wire-fixtures" }
plur1bus-wire-log = { path = "../plur1bus-wire-log" }
