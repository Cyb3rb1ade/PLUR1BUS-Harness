[graph]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Already approved by docs/dependency-policy.md (tiny-keccak via SFTP).
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

# MPL-2.0 is allowed by docs/dependency-policy.md only unmodified; option-ext is used unmodified (dirs-sys -> dirs 6 -> lance-index).
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Cyb3rb1ade/PLUR1BUS-Harness", "https://github.com/Cyb3rb1ade/tantivy"]
