[workspace]
exclude = ["apps", "fuzz"]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Cyb3rb1ade/PLUR1BUS-Harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
typify = "0.8"
schemars = "0.8"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
chrono-tz = "0.10"
regress = "0.10"

[patch.crates-io]
# lance-index 2.0.0 (pinned through lancedb 0.26.2, RE-D3) depends on tantivy 0.24.2, which pins lru 0.12
# (RUSTSEC-2026-0002, RUSTSEC-2026-0253) and zstd 0.13.3 (13 RUSTSEC advisories: RUSTSEC-2026-0391, -0395..-0406).
# The fork is upstream tag 0.24.2 plus lru 0.18.2 and zstd 0.14.3 (branch plur1bus/0.24.2-lru-0.18.2-zstd-0.14).
# Remove this entry when the Lance pin moves to a tantivy with lru >= 0.18.2 and zstd >= 0.14.3 or to no tantivy.
tantivy = { git = "https://github.com/Cyb3rb1ade/tantivy", rev = "0c34640dde00696629a37eb1a41bf6fe11e199e4" }

# arrow 57.3.1 closure: bump zstd to 0.14.3 in arrow-ipc to resolve RUSTSEC-2026-0391 and -0395..-0406 (RE-D30).
# All 14 crates in the arrow workspace present in Cargo.lock are redirected to avoid dual-registry type splits.
arrow = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-arith = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-array = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-buffer = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-cast = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-csv = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-data = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-ipc = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-json = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-ord = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-row = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
arrow-schema = { git = "https://github.com/Cyb3rb1ade/arrow-rs", rev = "cfe57eff8e9b84dd68e89e12e7fa7fcf6583c42b" }
