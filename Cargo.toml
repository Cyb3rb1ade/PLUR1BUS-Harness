# The Rust lint policy of docs/coding-standard.md §10 (CS-1), copied as written there. A crate inherits it only with
# `[lints] workspace = true`; in RE-00 that is `plur1bus-engine` alone, the other crates opt in under CS-1.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"          # tests: #![cfg_attr(test, allow(clippy::unwrap_used))]
expect_used = "warn"
panic = "warn"
large_enum_variant = "warn"
needless_pass_by_value = "warn"

# SHA-256 at opt-level 0 hashes about 17 MB/s (80 MB in 4.8 s on a fast x64 host). The test profile inherits `dev`, and
# on Windows the setup tests install the real `node.exe` (about 80 MB) as runtime/node, so `1staid check`'s
# `runtime.node` re-hash alone ran past the pass's 3 s budget on every pass and the extension rows after it read "time
# budget exhausted" (windows-2025, HM2 CI round 2: `firstaid_check_passes_on_a_host_profile`). Optimising this one
# crate brings the 80 MB to about 0.4 s; release builds are unaffected.
[profile.dev.package.sha2]
opt-level = 3

# The config schema (packages/config-schema) is compiled by `jsonschema` on every CLI start that reads config.json, after
# first being validated against the draft 2020-12 meta-schema. At opt-level 0 that costs ~0.7 s once the schema carries
# the `containers`/`sidecars` sections, which put the fast-fail CLI paths (`memory add`/`memory list` without a core,
# 1 s budget) over the line. Optimising the schema-compilation crates removes it; release builds are unaffected.
[profile.dev.package.jsonschema]
opt-level = 3
[profile.dev.package.referencing]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
